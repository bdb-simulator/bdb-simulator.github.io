  if (zone === 'hand') {
    if (owner !== controller()) return;
    if (pd?.type === 'discard') return dispatch({ type: 'DISCARD', uid });
    if (pd?.type === 'bright') return dispatch({ type: 'BRIGHT', discard: uid });
    if (pd?.type === 'seika' && pd.step === 'discard') return dispatch({ type: 'SEIKA', uid });
    if (!pd && S.phase === 'main') { ui.sel = ui.sel === uid ? null : uid; toast = ''; render(); }
    return;
  }
  if (zone === 'field') {
    if (pd?.type === 'block') { if (owner === pd.player) dispatch({ type: 'BLOCK', blocker: uid }); return; }
    if (!pd && S.phase === 'attack') {
      const u = Engine.findUnit(S, uid);
      if (!Engine.canAttack(S, u)) return;
      ui.tgt = { kind: 'attack', uid }; toast = ''; render();
    }
  }
}

/* ── 전체 카드 목록 (덱 편성용, 게시 페이지의 cards_db.json) ───────────── */
const CardDB = {

/* ── 끌어서 놓기 ──────────────────────────────────────

   8px 넘게 움직였을 때만 끌기로 보고, 그보다 적으면 평소처럼 클릭으로 처리 */
const Drag = { start: null, ghost: null, suppress: false };
function dragInfo(card) {
  if (!S || screen !== 'game' || S.winner != null || S.pending || !myControl() || ui.tgt) return null;
  const z = card.dataset.z, uid = card.dataset.u, owner = +card.dataset.o;
  if (owner !== S.active) return null;
  if (z === 'hand' && S.phase === 'main') return { kind: 'hand', uid };
  if (z === 'field' && S.phase === 'attack') { const u = Engine.findUnit(S, uid); if (u && Engine.canAttack(S, u)) return { kind: 'field', uid }; }
  return null;
}
function dropTargets(info) {
  const me = S.active, opp = 1 - me, sel = [];
  const mat = p => `[data-mat="${p}"]`;
  if (info.kind === 'hand') {
    const c = S.players[me].hand.find(x => x.uid === info.uid), d = DEFS[c.id];
    if (!S.players[me].energySet) sel.push(`${mat(me)} [data-drop="energy"]`);
    if (Engine.canPay(S.players[me], d)) {
      if (Engine.needsTarget(d)) Engine.targetsFor(S, me, d).forEach(u => sel.push(`.card[data-z="field"][data-u="${u}"]`));
      else sel.push(`${mat(me)} [data-drop="field"]`);
    }
  } else {
    const ts = Engine.attackTargets(S, me, info.uid);
    ts.filter(t => t !== 'player').forEach(u => sel.push(`.card[data-z="field"][data-u="${u}"]`));
    if (ts.includes('player')) sel.push(`section${mat(opp)}`);
  }

}
function dropAction(info, x, y) {
  const el = document.elementFromPoint(x, y); if (!el) return null;
  const me = S.active;
  const unitEl = el.closest('.card[data-z="field"]');
  const matEl = el.closest('[data-mat]'); const matP = matEl ? +matEl.dataset.mat : null;
  if (info.kind === 'hand') {
    const c = S.players[me].hand.find(x => x.uid === info.uid); if (!c) return null;
    const d = DEFS[c.id];
    if (el.closest('[data-drop="energy"]') && matP === me) return { type: 'SET_ENERGY', uid: info.uid };
    if (Engine.needsTarget(d)) {
      if (unitEl && Engine.targetsFor(S, me, d).includes(unitEl.dataset.u)) return { type: 'PLAY', uid: info.uid, target: unitEl.dataset.u };
      return null;
    }
    if (matP === me && (el.closest('[data-drop="field"]') || unitEl)) return { type: 'PLAY', uid: info.uid };
    return null;
  }
  const ts = Engine.attackTargets(S, me, info.uid);
  if (unitEl && +unitEl.dataset.o !== me && ts.includes(unitEl.dataset.u)) return { type: 'ATTACK', attacker: info.uid, target: unitEl.dataset.u };
  if (matP === 1 - me && ts.includes('player') && !unitEl) return { type: 'ATTACK', attacker: info.uid, target: 'player' };

function endDrag() {
  Drag.ghost?.remove(); Drag.ghost = null; Drag.start = null;

function initDrag(app) {
  app.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    const card = e.target.closest('.card[data-z]'); if (!card) return;
    const info = dragInfo(card); if (!info) return;
    Drag.start = { x: e.clientX, y: e.clientY, info, card };
  });
  document.addEventListener('pointermove', e => {
    const st = Drag.start; if (!st) return;
    if (!Drag.ghost) {
      if (Math.hypot(e.clientX - st.x, e.clientY - st.y) < 8) return;
      const r = st.card.getBoundingClientRect();
      const g = st.card.cloneNode(true);
      g.classList.add('ghost'); g.classList.remove('rested', 'sel', 'can', 'tg');
      Object.assign(g.style, { width: r.width + 'px', height: r.height + 'px' });
      document.body.appendChild(g); Drag.ghost = g;
      document.body.classList.add('dragging');
      dropTargets(st.info).forEach(q => document.querySelectorAll(q).forEach(el => el.classList.add('droptarget')));

    const st = Drag.start; if (!st) return;
    if (!Drag.ghost) { Drag.start = null; return; }   // 거의 안 움직였으면 클릭으로
    Drag.ghost.style.display = 'none';
    const a = dropAction(st.info, e.clientX, e.clientY);
    endDrag();

}

if (typeof document !== 'undefined' && document.getElementById('app')) {

  initDrag(app);
  app.addEventListener('click', onClick);
  // 고르기 창의 카드에 올리면 필드의 같은 카드를 표시
  const hl = (uid, on) => document.querySelectorAll(`.ps .card[data-z="field"][data-u="${uid}"]`).forEach(el => el.classList.toggle('hl', on));
  app.addEventListener('pointerover', e => { const p = e.target.closest('.pickc[data-hl]'); if (p) hl(p.dataset.hl, true); });
  app.addEventListener('pointerout', e => { const p = e.target.closest('.pickc[data-hl]'); if (p && !p.contains(e.relatedTarget)) hl(p.dataset.hl, false); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && ui.view) { ui.view = null; render(); return; }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-z][tabindex]')) { e.preventDefault(); e.target.click(); }
  });
  // 덱 편성 화면 입력 칸
  app.addEventListener('input', e => {
    const f = e.target.dataset?.bf; if (!f || !bld) return;
    if (f === 'label') bld.deck.label = e.target.value;
    else if (f === 'code') bld.code = e.target.value;
    else if (f === 'q') {
      bld.q = e.target.value;
      const pos = e.target.selectionStart; render();
      const inp = document.querySelector('.bq'); if (inp) { inp.focus(); inp.setSelectionRange(pos, pos); }
    }
  });
  app.addEventListener('change', e => {
    const f = e.target.dataset?.bf;
    if (f === 'collab') { bld.collab = +e.target.value; return render(); }
    if (f === 'load' && e.target.value) return openBuilder(e.target.value);
    const sel = e.target.closest('[data-deck]'); if (!sel) return;
    deckChoice[+sel.dataset.deck] = sel.value;
    if (online()) return;
    if (Net.code) Net.pushPresence();
    render();
  });
  MyDecks.load(); registerMyDecks();
  if (MyDecks.list.some(d => !deckKnown(d))) CardDB.load().then(() => render()).catch(() => {});
  render();
  Net.init();
  initPacks();
}
</script>
</body>
</html>
