<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>빌디바이드 브라이트 시뮬레이터 — 1단계</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Sans+KR:wght@400;500;700&family=M+PLUS+1p:wght@500;800&display=swap" rel="stylesheet">
<style>
/* ── 토큰 ─────────────────────────────────────────────
   밤 무대 같은 남색 매트 위에, 브라이트 로고의 핑크·시안으로 존을 구분.
   숫자(코스트·파워·라이프)는 Dela Gothic One, 카드 이름(일본어)은 M PLUS 1p, UI는 IBM Plex Sans KR. */
:root{
  --night:#17142b; --mat:#211d3d; --mat-2:#2a2550; --ink:#ece9f7; --ink-dim:#a29cc4; --ink-faint:#6c6693;
  --pink:#ff5fa2; --cyan:#3ec6e0; --yellow:#ffd23f; --redzone:#ff4d5e; --ok:#5fe0a8;
  --c-red:#e2553f; --c-blue:#3f86e8; --c-white:#d9d2bd; --c-black:#8e6ad6; --c-none:#8a86a3;
  --num:"Dela Gothic One", "IBM Plex Sans KR", sans-serif;
  --jp:"M PLUS 1p", "IBM Plex Sans KR", sans-serif;
  --ui:"IBM Plex Sans KR", system-ui, "Malgun Gothic", sans-serif;
  /* 카드 크기는 창 높이에 맞춤: 내 매트(필드+패) + 상대 매트(필드+뒷면) + 안내 바가 한 화면에 들어가도록 */
  --ch:132px; --cw:94px;   /* 카드·필드 크기 고정 (창이 작으면 보드가 스크롤됨) */
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--ink);font:14px/1.5 var(--ui)}
body{background:
  radial-gradient(1200px 500px at 15% -10%, #2b2152 0%, transparent 60%),
  radial-gradient(900px 500px at 110% 110%, #14324a 0%, transparent 60%), var(--night)}
button,select{font:inherit;color:var(--ink)}
button{background:var(--mat-2);border:1px solid #4a4380;border-radius:8px;padding:7px 14px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--cyan)}
button:disabled{opacity:.4;cursor:default}
button.go{background:var(--pink);border-color:var(--pink);color:#2a0716;font-weight:700}
button.go:hover:not(:disabled){filter:brightness(1.08);border-color:var(--pink)}
button.on{background:#1d4a52;border-color:var(--cyan)}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
select{background:var(--mat-2);border:1px solid #4a4380;border-radius:8px;padding:6px 8px;max-width:220px}

/* ── 상단: 턴 진행 ── */
.top{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid #2f2a57;background:#1a1733cc;position:sticky;top:0;z-index:4;backdrop-filter:blur(6px)}
.turnno{font-family:var(--num);font-size:22px;line-height:1}
.turnno small{font-family:var(--ui);font-size:12px;color:var(--ink-dim);margin-left:6px}
.phases{display:flex;gap:2px}
.phases span{padding:4px 10px;font-size:12.5px;color:var(--ink-faint);border-bottom:2px solid transparent}
.phases span.now{color:var(--ink);border-bottom-color:var(--pink)}
.who{color:var(--cyan);font-weight:700}
.top .spacer{flex:1}
.top label{font-size:12px;color:var(--ink-dim);display:flex;gap:6px;align-items:center}

/* ── 레이아웃 ── */
.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:0;height:calc(100vh - 57px)}
.board{padding:12px 16px;display:flex;flex-direction:column;gap:8px;min-width:0;overflow:auto;position:relative}

/* ── 매트: 공식 플레이 시트 배치 ── */
.mat{position:relative;background:linear-gradient(180deg,var(--mat),#1c1936);border:1px solid #352f66;border-radius:18px;padding:12px;display:grid;gap:10px;
  padding:10px 12px;gap:8px;grid-template-columns:150px minmax(0,1fr) 168px;
  grid-template-areas:"side field side2" "side hand side2"}
.mat.them{grid-template-areas:"side2 hand side" "side2 field side"}
.mat.turn{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink) inset}
.mat .hand{grid-area:hand}
.mat .left{grid-area:side} .mat .right{grid-area:side2}
.mat .fieldz{grid-area:field}

.pname{position:absolute;top:-11px;left:18px;background:var(--night);padding:0 10px;font-weight:700;font-size:13px;border-radius:6px}
.mat.turn .pname{color:var(--pink)}
.zone{border:1.5px dashed #4b4488;border-radius:12px;padding:8px;min-height:60px}
.zone h3{margin:0 0 6px;font-size:12px;font-weight:500;color:var(--ink-dim)}
/* 필드는 유닛이 없어도 항상 같은 크기 (카드 한 줄 높이 고정, 넘치면 옆으로 스크롤) */
.zone.field{border-style:solid;border-color:#3b356f;background:#1a1733;height:calc(var(--ch) + 18px);min-height:0;padding:2px 6px;
  background-image:repeating-linear-gradient(90deg,transparent 0 calc(var(--cw) + 10px),#ffffff08 calc(var(--cw) + 10px) calc(var(--cw) + 12px))}
.side{display:flex;flex-direction:column;gap:6px;min-width:0}

/* 덱·드롭 더미 */
.pile{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#1a1733;border:1.5px solid #4b4488;border-radius:12px;padding:8px 10px;color:var(--ink)}
.pile .n{font-family:var(--num);font-size:24px;line-height:1}
.pile .t{font-size:12px;color:var(--ink-dim)}
.pile .top1{display:block;font-family:var(--jp);font-size:11px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px}
button.pile:hover{border-color:var(--cyan)}
.pile.deck{border-color:#5a5390;cursor:default}

/* 라이프 게이지: 옐로 5 + 레드 5 */
.life{background:#1a1733;border:1.5px solid #4b4488;border-radius:12px;padding:8px 10px}
.life .row1{display:flex;align-items:baseline;justify-content:space-between}
.life .n{font-family:var(--num);font-size:30px;line-height:1}
.life.rz{border-color:var(--redzone);background:#2c1630}
.life.rz .n{color:var(--redzone)}
.life .zl{font-size:12px;color:var(--ink-dim)} .life.rz .zl{color:var(--redzone);font-weight:700}
.gauge{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:8px}
.gauge i{height:10px;border-radius:3px;background:#2e2a52}
.gauge i.y{background:var(--yellow)} .gauge i.r{background:var(--redzone)}
.gauge i.over{background:var(--cyan)}

/* 테리토리 */
.terr{background:#1a1733;border:1.5px dashed #4b4488;border-radius:12px;padding:8px 10px;font-size:12px;color:var(--ink-dim)}
.terr b{display:block;font-family:var(--jp);font-size:13px;color:var(--ink);font-weight:800}
.terr.open{border-style:solid;border-color:var(--yellow);background:linear-gradient(160deg,#3a3016,#1a1733 70%);color:var(--ink)}
.terr .st{display:inline-block;margin-top:4px;padding:1px 8px;border-radius:10px;font-size:11px;background:#2e2a52}
.terr.img{padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px}
.terr.img img{width:100%;max-width:120px;border-radius:8px;display:block}
.terr.img:not(.open) img{filter:saturate(.8)}
.terr.img .st{margin-top:0}
.terr.open .st{background:var(--yellow);color:#2b2200;font-weight:700}

/* 에너지 줄 */
button.energy{display:flex;flex-direction:column;gap:5px;width:100%;background:#1a1733;border:1.5px dashed #4b4488;border-radius:12px;padding:6px 8px;text-align:left}
button.energy .eh{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--ink-dim)}
button.energy .eh b{font-family:var(--num);font-weight:400;font-size:15px;color:var(--ink)}
.etiles{display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start}
.et{width:24px;height:34px;border-radius:4px;background:var(--ec);box-shadow:inset 0 0 0 1px #0004}
.et.black{background:#15131f;box-shadow:inset 0 0 0 1.5px #b9b3d6}
.et.white{background:#f3efe4}
.et.rested{width:34px;height:24px;margin:5px 0;opacity:.35}
.side.right button.energy{flex:1;min-height:96px;padding:8px 10px}
button.energy:hover{border-color:var(--cyan)}
.energy .lbl{font-size:12px;color:var(--ink-dim);margin-right:4px}
.en{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 4px;border-radius:14px;background:#2a2550;font-size:11.5px;font-family:var(--jp)}
.en i{width:14px;height:14px;border-radius:50%;flex:none}
.en.rested{opacity:.35}
.en .k{font-family:var(--ui);font-size:10px;color:var(--cyan)}
.energy .cnt{margin-left:auto;font-size:12px;color:var(--ink-dim)}

/* 패 */
.handrow{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;padding:6px 4px;height:calc(var(--ch) + 14px)}
.handrow > .card{flex:none}
.mat.them .handrow{height:46px;padding:2px 4px}
.mat.them .cardback{width:28px;height:40px}
.handrow .lbl{font-size:12px;color:var(--ink-dim);width:100%}
.cardback{width:44px;height:62px;border-radius:7px;border:1.5px solid #4b4488;background:
  repeating-linear-gradient(135deg,#2a2550 0 6px,#231f45 6px 12px)}

/* ── 카드 ── */
.card{position:relative;width:var(--cw);height:var(--ch);min-height:0;border-radius:10px;padding:6px 7px 7px;display:flex;flex-direction:column;gap:2px;
  background:linear-gradient(180deg,#2f2a58,#24204a);border:2px solid var(--cc,#666);color:var(--ink);text-align:left;font-size:11px;user-select:none;transition:transform .15s}
.card.red{--cc:var(--c-red)} .card.blue{--cc:var(--c-blue)} .card.white{--cc:var(--c-white)} .card.black{--cc:var(--c-black)} .card.none{--cc:var(--c-none)}
.card .cost{position:absolute;top:-8px;left:-8px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--cc);color:#fff;font-family:var(--num);font-size:14px;border:2px solid var(--night)}
.card.white .cost{color:#2b2717}
.card .trig{position:absolute;top:4px;right:6px;font-size:14px}
.card .nm{font-family:var(--jp);font-weight:800;font-size:11.5px;line-height:1.25;margin:4px 16px 0 14px;height:29px;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .ty{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px;max-height:56px;overflow:hidden}
.card .chips span{font-size:9.5px;line-height:1.3;padding:1px 5px;border-radius:6px;background:#1d4a52;color:#bff3ff;white-space:nowrap}
.card .chips span.t{background:#3a2a5c;color:#e3d6ff}
.card .fx{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card .body{overflow:hidden}
.card .ty{font-size:10px;color:var(--ink-dim)}
.card .ab{font-size:10px;color:#8ff0c6;line-height:1.3}
.card .tx{font-size:10px;color:#d8d3ee;line-height:1.3}
.card .fx{font-size:10.5px;color:#d8d3ee;line-height:1.35;margin-top:2px}
.card .stats{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;padding-top:4px}
.card .pw{font-family:var(--num);font-size:16px;line-height:1}
.card .pw.up{color:var(--ok)} .card .pw.down{color:#ff8a8a}
.card .hits{display:flex;gap:3px}
.card .hits i{width:9px;height:9px;border-radius:50%;background:var(--pink)}
.card .hits i.up{background:var(--ok)}
.card .dmg{position:absolute;bottom:26px;right:4px;background:#a3142b;color:#fff;border-radius:6px;padding:1px 6px;font-size:11.5px;font-weight:700;z-index:2;box-shadow:0 1px 4px #0008;white-space:nowrap}
.card .frag{position:absolute;top:4px;left:50%;transform:translateX(-50%);background:#5b2a8a;color:#fff;border-radius:6px;padding:0 5px;font-size:10px;z-index:2;white-space:nowrap;box-shadow:0 1px 3px #0007}
.card.rested .dmg,.card.rested .frag{transform:none}
.card .kw{position:absolute;top:-9px;right:6px;display:flex;gap:3px}
.card .kw span{background:var(--cyan);color:#062a33;font-size:9.5px;font-weight:700;border-radius:8px;padding:0 6px}
.card.rested{width:var(--ch);height:var(--cw);filter:saturate(.55) brightness(.85);
  background:repeating-linear-gradient(135deg,#2a2550 0 10px,#26224a 10px 20px)}
.card.rested::after{content:"레스트";position:absolute;left:8px;bottom:6px;font-size:10px;color:var(--ink-dim)}
.card.rested .stats{position:absolute;right:8px;bottom:6px}
.card.rested .ab,.card.rested .tx,.card.rested .chips{display:none}
.card.can{cursor:pointer;box-shadow:0 0 0 2px var(--cyan)}
.card.can:hover{transform:translateY(-4px)}
.card.rested.can:hover{transform:translateY(-4px)}
.card.sel{box-shadow:0 0 0 3px var(--pink);transform:translateY(-6px)}
.card.tg{cursor:pointer;box-shadow:0 0 0 3px var(--ok);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px transparent}}
.units{display:flex;flex-wrap:nowrap;gap:12px;align-items:center;height:100%;padding:6px 10px;overflow-x:auto;overflow-y:hidden}
.units > .card{flex:none}
.empty{color:var(--ink-faint);font-size:12.5px;padding:6px}

/* 이미지 카드: 이미지가 있으면 텍스트 몸통을 숨기고, 이미지가 막히면(noimg) 텍스트로 */
.card.hasimg{padding:0;background:#111;overflow:visible}
.card.hasimg .art{width:100%;height:100%;min-height:var(--ch);object-fit:cover;border-radius:8px;display:block}
.card.hasimg .body{display:none}
.card.hasimg.noimg{padding:6px 7px 7px;background:linear-gradient(180deg,#2f2a58,#24204a)}
.card.hasimg.noimg .art{display:none}
.card.hasimg.noimg .body{display:flex}
.card.noimg .badge{display:none}
.card .body{display:flex;flex-direction:column;gap:2px;flex:1}
.card.hasimg:not(.noimg) .cost,.card.hasimg:not(.noimg) .trig{display:none}
.card .badge{position:absolute;left:50%;transform:translateX(-50%);bottom:-9px;background:#17142b;border:1.5px solid var(--cc);border-radius:9px;padding:0 7px;font-family:var(--num);font-size:12px;white-space:nowrap}
.card .badge.up{color:var(--ok);border-color:var(--ok)} .card .badge.down{color:#ff8a8a;border-color:#ff8a8a}
.card.hasimg:not(.noimg) .dmg{bottom:auto;top:40%;right:-6px}
.card.hasimg.rested:not(.noimg){width:var(--cw);height:auto;min-height:var(--ch);transform:rotate(90deg) scale(.86);margin:0 22px;filter:brightness(.8)}
.card.hasimg.rested:not(.noimg)::after{content:none}
.card.hasimg.rested.can:hover{transform:rotate(90deg) scale(.9)}
.card.hasimg.rested:not(.noimg) .badge{transform:translateX(-50%) rotate(-90deg)}
.card.focus{outline:2px solid var(--yellow);outline-offset:3px}

/* ── 카드 설명 패널 ── */
.tabs{display:flex;gap:4px;margin-bottom:10px;position:sticky;top:-12px;background:#1a1733;padding-top:2px;z-index:1}
.tabs button{flex:1;padding:6px 8px;font-size:12.5px;border-radius:8px 8px 0 0;border-bottom-color:transparent;background:transparent;color:var(--ink-dim)}
.tabs button.on{background:var(--mat-2);color:var(--ink);border-color:#4a4380}
.detail{display:flex;flex-direction:column;gap:10px}
.detail .big{width:100%;max-width:260px;align-self:center;border-radius:12px;display:block;box-shadow:0 8px 30px #0008}
.detail .bigtext{align-self:center}
.detail .bigtext .card{--cw:220px;--ch:300px;font-size:13px}
.detail .bigtext .card .chips{max-height:none}
.detail h3{margin:0;font-family:var(--jp);font-size:17px;line-height:1.35}
.detail .meta{color:var(--ink-dim);font-size:12.5px}
.detail .nums{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.detail .nums b{font-family:var(--num);font-size:20px;font-weight:400}
.detail .nums .up{color:var(--ok)} .detail .nums .down{color:#ff8a8a}
.detail ul{margin:0;padding-left:18px;font-size:13px;line-height:1.55}
.detail li{margin:3px 0}
.detail ul.ja li{font-family:var(--jp)}
.langrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.langrow button{font-size:12px;padding:4px 10px}
.detail .where{font-size:12px;color:var(--ink-faint)}
.manual{border:1px solid #3b356f;border-radius:10px;padding:6px 10px;background:#1a1733}
.manual summary{cursor:pointer;font-size:13px;color:var(--ink-dim)}
.manual .mrow{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:8px}
.manual .mrow span{width:100%;font-size:11.5px;color:var(--ink-faint)}
.manual button{font-size:12px;padding:4px 8px}
.detail .acts{display:flex;gap:6px;flex-wrap:wrap}
.detail .hint{color:var(--ink-faint);font-size:12.5px;line-height:1.6}
.sheet .split{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;overflow:hidden;min-height:0;flex:1}
.sheet .split .body{min-height:0}
.sheet .split .side-d{overflow:auto;padding:16px 18px 20px 0}
@media (max-width:760px){.sheet .split{grid-template-columns:1fr}.sheet .split .side-d{padding:0 18px 18px}}

/* ── 끌어서 놓기 ── */
.card.ghost{position:fixed;z-index:40;pointer-events:none;transform:translate(-50%,-55%) rotate(-3deg) scale(1.04);box-shadow:0 18px 40px #000b;opacity:.95}
.card.can,.mat.me .handrow .card.can{cursor:grab;touch-action:none}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none}
.droptarget{outline:2px dashed var(--ok)!important;outline-offset:3px;background-color:#1f3a3440!important}
section.mat.droptarget{outline-offset:-3px}

/* ── 진행 안내 바 ── */
.prompt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-radius:14px;background:#2a1d3f;border:1px solid #5b3b78}
.prompt .msg{flex:1 1 320px}
.prompt .msg b{color:var(--pink)}
.prompt .cards{display:flex;gap:12px;flex-wrap:wrap;flex:1 1 100%;padding:6px 0 2px 8px}
.prompt{min-height:46px;padding:8px 14px}
.prompt.float{position:fixed;left:calc((100vw - 320px) / 2);top:50%;transform:translate(-50%,-50%);z-index:8;max-width:min(900px,calc(100vw - 360px));
  max-height:80vh;overflow:auto;box-shadow:0 20px 60px #000a;background:#2a1d3f}
@media (max-width:1100px){.prompt.float{left:50%;max-width:calc(100vw - 24px)}}
.builder{display:grid;grid-template-columns:minmax(0,1fr) 330px 290px;grid-template-areas:"head head head" "pool deck detail";gap:14px;padding:14px 18px;height:100vh;box-sizing:border-box}
.builder .bh{grid-area:head;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.builder .dname{font-size:16px;padding:8px 10px;min-width:220px;background:#1a1733;border:1px solid #4b4488;border-radius:8px;color:var(--ink)}
.builder select,.builder .bq,.builder textarea{background:#1a1733;border:1px solid #4b4488;border-radius:8px;color:var(--ink);padding:7px 9px;font:inherit}
.builder .bmsg{color:var(--cyan);font-size:13px}
.builder .spacer{flex:1}
.bpool{grid-area:pool;min-height:0;display:flex;flex-direction:column;gap:8px}
.bfilters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bfilters label{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink-dim)}
.bfilters select{max-width:300px}
.bfilters .bq{flex:1 1 220px}
.seg{display:flex;gap:2px}
.seg button{padding:5px 9px;font-size:12px}
.bgrid{flex:1;min-height:0;overflow:auto;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;padding:4px}
.bcell{position:relative}
.bcell .card{cursor:pointer}
.bcell.in .card{outline:2px solid var(--pink);outline-offset:2px}
.bcell .bn{position:absolute;top:-6px;right:-6px;background:var(--pink);color:#1a0d1f;font-family:var(--num);font-weight:700;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:13px}
.bdeck{grid-area:deck;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;background:#1a1733;border:1px solid #352f66;border-radius:14px;padding:12px}
.bterr{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1.5px solid var(--gold,#d9b85c);border-radius:10px;font-family:var(--jp)}
.bterr.empty{border-style:dashed;border-color:#4b4488;color:var(--ink-faint);font-family:inherit;font-size:13px;flex-direction:column;align-items:flex-start}
.bterr span{flex:1;cursor:pointer;display:flex;flex-direction:column}

.bsum{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 8px;font-size:12px;color:var(--ink-dim)}

.bcolors{display:flex;gap:10px;font-size:12.5px}
.bcolors span{display:flex;gap:4px;align-items:center}
.bcolors .et{width:12px;height:17px}
.berr{margin:0;padding-left:18px;color:var(--redzone);font-size:12.5px}
.blist{list-style:none;margin:0;padding:0}

.blist .dot{width:9px;height:9px;border-radius:50%}
.blist .cst{font-family:var(--num);color:var(--ink-dim);text-align:center}
.blist .nm{font-family:var(--jp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blist .tag{font-size:11px;color:var(--ink-faint)}
.blist b{font-family:var(--num);font-weight:400;text-align:center}
.pm{padding:0;width:24px;height:24px;line-height:1;font-size:15px}
.bcode textarea{width:100%;box-sizing:border-box;margin:6px 0;font-family:var(--num);font-size:11.5px;resize:vertical}
.bdetail{grid-area:detail;position:static;min-height:0;overflow:auto}
@media (max-width:1180px){.builder{grid-template-columns:minmax(0,1fr) 320px;grid-template-areas:"head head" "pool deck";height:auto}.bdetail{display:none}.bgrid{max-height:70vh}}
.modes .spacer{flex:1}
.strip{display:flex;align-items:center;gap:12px;height:54px;flex:0 0 54px;padding:0 10px 0 14px;border-radius:14px;background:#2a1d3f;border:1px solid #5b3b78;overflow:hidden}
.strip .phases{flex:0 0 auto;display:flex;flex-direction:column;gap:0;font-size:11px;line-height:1.25}
.strip .phases span{padding:0 6px;border-bottom:0;border-left:2px solid transparent}
.strip .phases span.now{border-left-color:var(--pink)}
.strip .phases{flex-direction:row;align-items:center}
.strip .phases span{padding:3px 7px;border-left:0;border-bottom:2px solid transparent}
.strip .phases span.now{border-bottom-color:var(--pink);color:var(--ink)}
.prompt.in{flex:1;min-width:0;min-height:0;height:100%;padding:0;border:0;background:transparent;border-radius:0;flex-wrap:nowrap}
.prompt.in .msg{flex:1 1 auto;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px;line-height:1.4}
.prompt.in button{flex:0 0 auto;white-space:nowrap}
.strip .nextph{flex:0 0 auto;padding:10px 18px;font-size:15px}
.prompt .scout{display:flex;flex-direction:column;gap:6px;align-items:center}

/* ── 카드 목록 창 ── */
.modal{position:fixed;inset:0;background:#0b0918b8;display:grid;place-items:center;z-index:10;padding:20px}
.sheet{background:var(--mat);border:1px solid #4b4488;border-radius:16px;width:min(900px,100%);max-height:86vh;display:flex;flex-direction:column}
.sheet header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid #352f66}
.sheet h2{margin:0;font-size:16px}
.sheet header .sub{color:var(--ink-dim);font-size:12.5px;flex:1}
.sheet .body{overflow:auto;padding:16px 18px 20px;display:flex;flex-direction:column;gap:14px}
.sheet .grid{display:flex;flex-wrap:wrap;gap:16px 14px;padding:8px 0 0 8px}
.sheet .grp{display:flex;flex-direction:column;align-items:center;gap:4px}
.sheet .grp .x{font-family:var(--num);font-size:13px;color:var(--ink-dim)}
.sheet .sum{display:flex;gap:8px;flex-wrap:wrap}
.sheet .sum span{background:#2a2550;border-radius:10px;padding:2px 10px;font-size:12px}
.seg{display:flex;gap:4px}

/* ── 로비 ── */
.lobby{max-width:1280px;margin:0 auto;padding:28px 22px 40px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;
  grid-template-areas:"head head" "modes modes" "body detail"}
.lobby .lh{grid-area:head}
.lobby h1{margin:0;font-family:var(--num);font-weight:400;font-size:30px;line-height:1.2;letter-spacing:.01em;
  background:linear-gradient(90deg,var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.lobby .lh p{margin:6px 0 0;color:var(--ink-dim)}
.modes{grid-area:modes;display:flex;gap:6px}
.modes button{padding:10px 18px}
.lbody{grid-area:body;display:flex;flex-direction:column;gap:16px;min-width:0}
.ldetail{grid-area:detail;background:#1a1733;border:1px solid #352f66;border-radius:14px;padding:14px;align-self:start;position:sticky;top:16px}
.lead{margin:0;font-size:15px}
.hint{color:var(--ink-faint);font-size:12.5px}
.warn{color:#ffb3b5;font-size:13px}
.good{color:var(--ok)} .bad{color:#ff8a8a}
.decks2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pickdeck{display:flex;flex-direction:column;gap:8px}
.pickdeck label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink-dim)}
.pickdeck select{max-width:none}
.decklist{background:#1a1733;border:1px solid #352f66;border-radius:12px;padding:10px 12px}
.decklist .dh{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--ink-dim);margin-bottom:6px}
.decklist .dh b{color:var(--ink);font-size:14px}
.decklist ul{list-style:none;margin:0;padding:0}
.decklist li{display:grid;grid-template-columns:12px minmax(0,1fr) auto 34px;gap:8px;align-items:center;padding:5px 4px;border-top:1px solid #26224a;cursor:pointer;font-size:13px}
.decklist li:hover{background:#231f45}
.decklist .dot{width:10px;height:10px;border-radius:50%}
.decklist .nm{font-family:var(--jp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.decklist .tag{font-size:11.5px;color:var(--ink-faint)}
.decklist li b{font-family:var(--num);font-weight:400;text-align:right}
.startrow{display:flex;gap:12px;align-items:center}
button.big{padding:12px 28px;font-size:16px}
.roomrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.roomrow input{font:inherit;color:var(--ink);background:var(--mat-2);border:1px solid #4a4380;border-radius:8px;padding:8px 10px;width:150px;letter-spacing:.1em}
.or{color:var(--ink-faint)}
.roominfo{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.roominfo .code{font-family:var(--num);font-weight:400;font-size:26px;letter-spacing:.12em;color:var(--yellow)}
.roominfo .spacer{flex:1}
.conn{font-size:12px;padding:2px 10px;border-radius:10px;background:#3a2a2a;color:#ffb3b5}
.conn.on{background:#1d4a3c;color:var(--ok)}
.people{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.people li{background:#1a1733;border:1px solid #352f66;border-radius:10px;padding:8px 12px}
.roomtag{font-size:12.5px;color:var(--ink-dim)}
@media (max-width:900px){.lobby{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "modes" "body" "detail"}.decks2{grid-template-columns:minmax(0,1fr)}.ldetail{position:static}}

/* ── 로그 ── */
.log{border-left:1px solid #2f2a57;background:#1a1733;padding:12px 14px;overflow-y:auto;height:calc(100vh - 57px);position:sticky;top:57px;font-size:12.5px}
.log h2{margin:0 0 8px;font-size:13px;color:var(--ink-dim);font-weight:500}
.log .lines div{padding:3px 0;border-bottom:1px solid #26224a}
.log .turn{color:var(--pink);font-weight:700;padding-top:10px}
.log .trg{color:#8ff0c6}
.toast{position:fixed;top:66px;left:50%;transform:translateX(-50%);background:#5a1830;border:1px solid var(--redzone);padding:9px 18px;border-radius:10px;z-index:20}
details.rules{border:1px solid #352f66;border-radius:14px;padding:10px 14px;color:var(--ink-dim);font-size:12.5px;background:#1a1733}

@media (max-width:1100px){
  .main{grid-template-columns:1fr;height:auto}

}
@media (max-width:720px){
  :root{--cw:92px;--ch:132px}
  .top{gap:10px;padding:8px 12px}
  .top label{font-size:11px} select{max-width:150px;padding:4px 6px}
  .board{padding:12px 10px 20px}
  .mat,.mat.them{grid-template-columns:1fr 1fr;grid-template-areas:"field field" "side side2" "hand hand"}
  .mat.them{grid-template-areas:"hand hand" "side2 side" "field field"}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── 공식 플레이 시트 디자인 ──────────────────────────
   시트 비율(3000×2123)을 그대로 지키고, 화면에 맞게 시트 전체를 키우거나 줄임.
   --sh = 시트 높이. 각 칸의 위치·크기는 공식 시트 그림에서 잰 비율(%)이고, 카드 크기도 시트 높이에 비례.
   상대 시트는 180도 돌린 배치 */
:root{--ps-ink:#3a3352;--ps-dim:#857a9b;--ps-line-p:#f0a9c6;--ps-line-b:#9fcbe8}
.board{--sh:clamp(200px, calc((100vh - 180px) / 2.46), 480px);align-items:stretch;padding:10px 16px}
.board > *{width:100%;flex:none}
.ps{position:relative;height:var(--sh);border-radius:calc(var(--sh) * .03);
  /* 세로 비율은 공식 시트 그대로(3단), 가로는 화면 폭에 맞춰 필드·에너지 존이 늘어남 */
  display:grid;gap:calc(var(--sh) * .02);padding:calc(var(--sh) * .02);
  grid-template-columns:calc(var(--sh) * .36) minmax(0,1fr) calc(var(--sh) * .34);
  grid-template-rows:1fr 1fr .95fr;
  grid-template-areas:"yellow field terr" "red field deck" "remove energy drop";
  --ch:calc(var(--sh) * .27);--cw:calc(var(--ch) * .714);--fs:calc(var(--sh) * .028);
  background:linear-gradient(180deg,#f7d8e6 0%,#eadff0 45%,#d6e8f4 100%);color:var(--ps-ink);box-shadow:0 6px 24px #0006}
.ps.them{background:linear-gradient(0deg,#f7d8e6 0%,#eadff0 45%,#d6e8f4 100%);
  grid-template-rows:.95fr 1fr 1fr;grid-template-areas:"drop energy remove" "deck field red" "terr field yellow"}
.ps .lz.y{grid-area:yellow}.ps .lz.r{grid-area:red}
.ps .remove{grid-area:remove}.ps .field{grid-area:field}.ps .terr{grid-area:terr}.ps .deck{grid-area:deck}.ps .energy{grid-area:energy}.ps .drop{grid-area:drop}
.ps .terr{flex-direction:row!important;align-items:stretch}
.ps .terr .zl{writing-mode:horizontal-tb}
.ps .terr{display:grid!important;grid-template-rows:auto minmax(0,1fr)}
.ps.turn{box-shadow:0 0 0 3px var(--pink),0 6px 24px #0006}
.ps .pname{position:absolute;top:-11px;left:calc(var(--sh) * .05);background:var(--night);color:var(--ink);padding:1px 12px;font-weight:700;font-size:12.5px;border-radius:6px;z-index:3;white-space:nowrap}
.ps.them .pname{top:auto;bottom:-11px}
.ps.turn .pname{color:var(--pink)}
.ps .z{position:relative;background:#ffffffa6;border:1.5px solid var(--ps-line-p);border-radius:calc(var(--sh) * .02);min-width:0;min-height:0;color:var(--ps-ink);
  padding:calc(var(--sh) * .015) calc(var(--sh) * .02);text-align:left;overflow:hidden;font-size:var(--fs)}
.ps .z.energy,.ps .z.drop,.ps .z.remove,.ps .z.deck{border-color:var(--ps-line-b)}
.ps button.z{font:inherit;font-size:var(--fs);cursor:pointer}
.ps button.z:hover{background:#fff;border-color:#6fb6e0}
.ps .zl{display:block;font-family:var(--num);font-size:calc(var(--fs) * 1.05);letter-spacing:.06em;color:var(--ps-dim);line-height:1.1}
.ps .zl small{display:block;font-family:var(--ui);font-size:calc(var(--fs) * .9);letter-spacing:0;font-weight:500}
/* 라이프 존: 옐로 존과 레드 존 두 칸 */
.ps .lz{display:flex;flex-direction:column;background:#fff8dd;border-color:#f2cf55}
.ps .lz.r{background:#ffe8ee;border-color:#ef8aa0}
.ps .lz .slots{flex:1;display:flex;gap:4%;align-items:stretch;padding:4% 2% 0}
.ps .lz .slots i{flex:1;border-radius:4px;border:1.5px dashed #d7c7a0;display:flex;align-items:flex-end;justify-content:center;font-style:normal}
.ps .lz.r .slots i{border-color:#e7aab8}
.ps .lz .slots i b{font-family:var(--num);font-weight:400;font-size:calc(var(--fs) * 1.3);color:#b5a88a;padding-bottom:4px}
.ps .lz .slots i.on{border:0;background:linear-gradient(180deg,#6c5fb0,#3d3470);box-shadow:inset 0 0 0 2px #fff6}
.ps .lz .slots i.on b{color:#fff}
.ps .lz .lhead{display:flex;justify-content:space-between;align-items:flex-start}
.ps .lz .lhead b{font-family:var(--num);font-weight:400;font-size:calc(var(--fs) * 2.1);line-height:1}
.ps.rz .lz.r{background:#ffd0db;border-color:var(--redzone);box-shadow:0 0 0 2px #ff4d5e55}
.ps.rz .lz.r .lhead b{color:#e0283e}
/* 필드: 공식 시트처럼 테두리 없이 위쪽에 FIELD 글자 */
.ps .field{border:0;background:transparent;padding:0}
.ps .field .wm{position:absolute;left:0;right:0;top:2%;font-family:var(--num);font-size:calc(var(--fs) * 1.8);letter-spacing:.1em;color:#8f84a8;text-align:center;line-height:1;pointer-events:none}
.ps .field .wm small{display:block;font-family:var(--ui);font-size:calc(var(--fs) * .85);letter-spacing:.2em;margin-top:2px}
.ps.them .field .wm{top:auto;bottom:2%}
.ps .field .units{position:absolute;inset:14% 2% 3%;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:calc(var(--sh) * .02);padding:0;overflow:visible}
.ps.them .field .units{inset:3% 2% 14%}
.ps .zone{all:unset}
/* 테리토리 */
.ps .terr{display:flex;flex-direction:column;gap:3%;cursor:pointer}
.ps .terr .tbody{flex:1;display:flex;flex-direction:column;gap:3%;align-items:center;min-height:0}
.ps .terr .tbody{position:relative}
.ps .terr img,.ps .terr .tcard{height:100%;width:auto;max-width:100%;aspect-ratio:5/7;object-fit:contain;border-radius:4px;box-shadow:0 1px 4px #0003;background:#c9c0e0}
.ps .terr img:not([hidden]) + .tcard{display:none}
.ps .terr .tinfo{position:absolute;left:0;right:0;bottom:0;background:#ffffffd9;border-radius:4px;padding:1px 2px}
.ps .terr .tinfo{text-align:center;min-width:0;width:100%}
.ps .terr .tinfo b{display:block;font-family:var(--jp);font-size:calc(var(--fs) * .95);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps .terr .st{display:block;font-size:calc(var(--fs) * .85);color:var(--ps-dim);background:none;padding:0;margin:0;border-radius:0}
.ps .terr.open{border-color:#e6b422;background:#fff6d6}
.ps .terr.open .st{color:#9a7300;font-weight:700}
/* 덱·드롭·리무브 */
.ps .pilez{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:4px}
.ps .pilez .zl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps .pilez .stack{flex:1;display:flex;align-items:center;justify-content:center;gap:10%;min-height:0;margin:0}
.ps .pilez .stack b{font-family:var(--num);font-weight:400;font-size:calc(var(--sh) * .06);line-height:1;flex:none}
.ps .pilez .cardback,.ps .pilez .mini{height:100%;max-height:calc(var(--sh) * .2);width:auto;aspect-ratio:5/7;border-radius:4px;flex:none;object-fit:cover}
.ps .mini{object-fit:cover;box-shadow:0 1px 4px #0003}
.ps .mini.txt{display:block;font-family:var(--jp);font-size:calc(var(--fs) * .7);line-height:1.2;padding:3px;overflow:hidden;background:#fff;border:1.5px solid #aaa}
/* 에너지 존 */
.ps .energy{display:flex;flex-direction:column}
.ps .energy .ehead{display:flex;justify-content:space-between;align-items:flex-start}
.ps .ecount{font-size:calc(var(--fs) * .95);color:var(--ps-dim);white-space:nowrap}
.ps .ecount b{font-family:var(--num);font-weight:400;font-size:calc(var(--fs) * 1.8);line-height:1;color:var(--ps-ink)}
.ps .etiles{flex:1;display:flex;flex-wrap:wrap;gap:calc(var(--sh) * .015);align-items:center;align-content:center;justify-content:center;min-height:0}
.ps .et{width:calc(var(--sh) * .085);height:calc(var(--sh) * .119);border-radius:4px;box-shadow:0 1px 3px #0003,inset 0 0 0 1.5px #fff8;margin:0}
.ps .et.white{background:#fffdf6;box-shadow:0 1px 3px #0003,inset 0 0 0 1.5px #c9bf9e}
.ps .et.black{background:#24203a;box-shadow:0 1px 3px #0003,inset 0 0 0 1.5px #8d84b8}
.ps .et.rested{width:calc(var(--sh) * .119);height:calc(var(--sh) * .085);opacity:.38}
.ps .empty{color:var(--ps-dim);font-size:var(--fs)}
.ps .droptarget{outline:3px dashed #18a77a!important;background-color:#d9fff0!important}
.ps.droptarget{outline:3px dashed #18a77a;outline-offset:2px}
/* 패: 내 패는 시트 아래, 상대 패는 장수만 이름표에 */
.hand.me{--ch:calc(var(--sh) * .36);--cw:calc(var(--ch) * .714)}
.hand.me .handrow{height:calc(var(--ch) + 12px);justify-content:flex-start}
.hand.me .handrow > :first-child{margin-left:auto}.hand.me .handrow > :last-child{margin-right:auto}   /* 넘치면 왼쪽 끝부터 보이게 가운데 정렬 */
.hand .empty{color:var(--ink-faint);font-size:12px}
.strip{height:46px;flex-basis:46px}

/* 넓은 화면: 카드를 크게, 테리토리는 그림 옆에 이름 */
.ps{--ch:calc(var(--sh) * .36)}
.hand.me{--ch:calc(var(--sh) * .44)}
.ps .terr .tbody{flex-direction:row!important;align-items:stretch;gap:8px}
.ps .terr img,.ps .terr .tcard{height:100%;width:auto;max-width:55%;flex:none}
.ps .terr .tinfo{position:static!important;background:none!important;text-align:left!important;align-self:center;flex:1;min-width:0}
.ps .terr .tinfo b{color:var(--ps-ink)!important;font-weight:800;white-space:normal!important;display:-webkit-box!important;-webkit-line-clamp:3;-webkit-box-orient:vertical}

/* 진행 바는 가운데 정렬, 턴 진행 버튼은 내 패 오른쪽 */
.strip{justify-content:center}
.prompt.in{flex:0 1 auto;justify-content:center}
.prompt.in .msg{flex:0 1 auto;text-align:center}
.hand.me{display:flex;align-items:center;gap:12px}
.hand.me .handrow{flex:1;min-width:0}
.turnbtns{flex:none;display:flex;flex-direction:column;gap:8px;min-width:150px}
.turnbtns button{padding:10px 16px;font-size:15px;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.turnbtns button small{font-size:11px;opacity:.75;font-weight:400}

/* 앞면이 가로인 테리토리: 저장된 그림(세로 비율로 맞춰짐)을 가로 비율로 펼쳐서 표시 */
.card.hasimg.land:not(.noimg){width:var(--ch);height:var(--cw);min-height:0}
.card.hasimg.land:not(.noimg) .art{min-height:0;height:100%;object-fit:fill}

/* ── 연출 ── */

@keyframes fxBan{0%{opacity:0;transform:translate(-50%,-50%) scale(.85)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}22%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-56%)}}

const Engine = (() => {
  let seq = 0;
  const newUid = () => 'c' + (++seq);
  const D = c => DEFS[c.id];
  if (!DEFS.NOTERR) DEFS.NOTERR = { id: 'NOTERR', name: '테리토리 없음', type: 'territory', titles: [], cost: 99, attr: [], icons: [], noTerr: 1 };
  const fail = m => { throw new Error(m); };
  const name = c => DEFS[c.id].name;

  /** 시드가 있는 난수 (mulberry32). 상태 s.rng에 들어 있어서, 같은 시드와 같은 행동이면 어느 기기에서든 같은 게임이 됨 (온라인 동기화의 기반) */
  function rand(s) {
    let t = (s.rng = (s.rng + 0x6D2B79F5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function shuffle(a, s) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand(s) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  function log(s, m, cls) { s.log.push(cls ? { m, cls } : { m }); }
  /** 연출용 사건 기록 (화면이 순서대로 보여 줌). 게임 진행에는 쓰지 않음 */
  function fxe(s, ev) { s.fxSeq = (s.fxSeq || 0) + 1; (s.fx ||= []).push({ n: s.fxSeq, ...ev }); if (s.fx.length > 80) s.fx.splice(0, s.fx.length - 80); }

  function validateDeck(deck) {
    const list = deck.main, errs = [];
    const sum = f => list.filter(([id]) => f(DEFS[id])).reduce((t, [, n]) => t + n, 0);
    const total = sum(() => true);
    if (total < RULES.deckMin || total > RULES.deckMax) errs.push(`메인 덱은 ${RULES.deckMin}~${RULES.deckMax}장 (현재 ${total}장)`);
    const byName = {};
    for (const [id, n] of list) byName[DEFS[id].name] = (byName[DEFS[id].name] || 0) + n;
    for (const [nm, n] of Object.entries(byName)) if (n > (list.map(([id]) => DEFS[id]).find(d => d.name === nm)?.maxCopies ?? RULES.maxCopies) && !list.some(([id]) => DEFS[id].name === nm && DEFS[id].anyCopies)) errs.push(`${nm}: 같은 이름은 ${RULES.maxCopies}장까지 (현재 ${n}장)`);
    if (sum(d => d.type === 'territory')) errs.push('메인 덱에 테리토리는 넣을 수 없음');
    const b = sum(d => d.icon === 'buster'); if (b !== RULES.busterExact) errs.push(`버스터는 정확히 ${RULES.busterExact}장 (현재 ${b}장)`);
    const sh = sum(d => d.icon === 'shot'); if (sh > RULES.shotMax) errs.push(`샷은 ${RULES.shotMax}장까지 (현재 ${sh}장)`);
    if (!deck.territory || DEFS[deck.territory].type !== 'territory') errs.push('테리토리 카드 1장이 필요');
    return errs;
  }

  function createPlayer(s, nm, deck) {
    const cards = shuffle(deck.main.flatMap(([id, n]) => Array.from({ length: n }, () => ({ uid: newUid(), id }))), s);
    return { name: nm, deck: cards, hand: [], life: [], energy: [], drop: [], remove: [], set: [], energySet: false,
      territory: { uid: newUid(), id: deck.territory, open: false } };
  }

  /* ---- 이번 판 기록 (s.hist) ----
     카드가 어느 영역에서 어느 영역으로 옮겨졌는지를 행동마다 비교해서 자동으로 남기고(k:'mv'),
     플레이·데미지·브라이트·테리토리 개방·공격·블록·배틀 결과는 따로 남김.

     영역 이름: deck hand life drop energy energyD(뒷면) remove set field fieldR(레스트) att(유닛에 붙음) tatt(테리토리에 붙음) */

    const saved0 = this.load(code);
    try { this.room = await this.lobby.join('bdb-' + code, { host: (saved0 ? saved0.seat : seat) === 0 }); }
    catch (e) { this.status = '방에 들어가지 못했어요: ' + (this.peerMode ? e.message : (e.code || e.message)); return render(); }
    this.code = code; this.status = '';
    const saved = this.load(code);
    this.seat = saved ? saved.seat : seat;
    const r = this.room;
    r.on('setup', m => { if (!m.sameTab) this.onSetup(m.data); });
    r.on('act', m => { if (!m.sameTab) this.onAct(m.data); });
    r.on('need', m => { if (!m.sameTab) this.onNeed(m.data); });
    r.on('tip', m => {
      if (m.sameTab || !m.data?.gid) return;
      if (m.data.gid !== this.gid) return this.askNeed();          // 시작 메시지를 놓쳤으면 다시 요청 (상대가 setup을 다시 보냄)
      if (m.data.n > this.acts.length) this.askNeed();
    });
    r.onConnection(c => { this.connected = c; render(); });
    r.onPeers(ch => {
      this.peers = ch.peers;
      if (this.seat === 1 && !saved && ch.joined.some(p => !p.isMe && p.presence?.seat === 1) && !this.gid) { /* 자리 중복은 아래 seatTaken에서 표시 */ }
      // 방장이 진행 중인 게임을 새로 들어온(또는 다시 들어온) 사람에게 알려 줌
      if (this.gid && ch.joined.some(p => !p.isMe)) this.emit('setup', this.setup);
      render();
    });
    if (saved?.setup) {
      if (saved.setup.decks.every(deckKnown)) this.restore(saved);
      else CardDB.load().then(() => { if (!this.gid && saved.setup.decks.every(deckKnown)) { this.restore(saved); render(); } }).catch(() => {});
    }
    this.pushPresence();
    this.timer = setInterval(() => { if (this.gid) this.emit('tip', { gid: this.gid, n: this.acts.length }); }, 1500);
    render();
  },
  async leave() {
    clearInterval(this.timer);
    try { await this.room?.leave(); } catch {}
    Object.assign(this, { room: null, code: null, seat: -1, peers: [], gid: null, setup: null, acts: [], buffer: {} });
    screen = 'lobby'; render();
  },
  pushPresence() {
    const k = deckChoice[Math.max(0, this.seat)] || null, ref = k ? deckRef(k) : null;
    this.room?.presence({ seat: this.seat, deck: k, deckData: typeof ref === 'object' ? ref : undefined, ready: !!this.ready, gid: this.gid }).catch(() => {});
  },
  emit(topic, data) { return this.room?.emit(topic, data).catch(e => { if (e.code === 'not_permitted') { this.status = '이 페이지에서 보낼 권한이 없어요. 방장에게 공유 권한(참여자 이상)을 받아야 해요.'; render(); } }); },
  others() { return this.peers.filter(p => !p.isMe && p.kind === 'viewer'); },
  opponent() { return this.others().find(p => p.presence?.seat === 1 - this.seat); },
  seatTaken(seat) { return this.others().some(p => p.presence?.seat === seat); },
  start() {   // 방장만
    const opp = this.opponent(); if (!opp || !deckChoice[0]) return;
    const od = opp.presence.deckData || (DECKS[opp.presence.deck] && !DECKS[opp.presence.deck].mine ? opp.presence.deck : 'bocchi');
    const decks = [deckRef(deckChoice[0]), od];
    const setup = { gid: Math.random().toString(36).slice(2, 10), seed: (Math.random() * 4294967296) >>> 0, decks };
    this.onSetup(setup, true);
    this.emit('setup', setup);
  },
  onSetup(st, mine) {
    if (!st || !st.gid || !Array.isArray(st.decks) || st.decks.length !== 2) return;
    if (st.gid === this.gid) return;   // 이미 진행 중인 같은 게임
    if (!st.decks.every(deckKnown)) {   // 상대가 만든 덱: 전체 카드 목록을 받은 뒤 시작
      if (st.decks.some(x => !resolveDeck(x))) return;
      this.status = '상대 덱의 카드 정보를 불러오는 중이에요';
      render();
      CardDB.load().then(() => { this.status = ''; if (st.decks.every(deckKnown)) this.onSetup(st, mine); }).catch(() => { this.status = '카드 정보를 불러오지 못해 게임을 시작할 수 없어요'; render(); });
      return;
    }
    this.gid = st.gid; this.setup = st; this.acts = []; this.buffer = {};
    beginGame(st.decks, st.seed);
    this.save(); this.pushPresence();
    if (!mine) this.askNeed(true);
    render();
  },
  restore(saved) {
    this.gid = saved.setup.gid; this.setup = saved.setup; this.acts = []; this.buffer = {};
    beginGame(saved.setup.decks, saved.setup.seed);
    for (const a of saved.acts || []) { try { S = Engine.apply(S, a); this.acts.push(a); } catch { break; } }
    this.askNeed(true);
  },
  sendAct(a) {
    const i = this.acts.length; this.acts.push(a); this.save();
    this.emit('act', { gid: this.gid, i, a });
  },
  onAct(d) {
    if (!d || d.gid !== this.gid || typeof d.i !== 'number') return;
    if (d.i < this.acts.length) return;            // 이미 적용함
    this.buffer[d.i] = d.a;
    let applied = false;
    while (this.buffer[this.acts.length] !== undefined) {
      const a = this.buffer[this.acts.length]; delete this.buffer[this.acts.length];
      try { S = Engine.apply(S, a); }
      catch (e) { this.status = '상대와 게임 상태가 어긋났어요. 방을 나갔다가 다시 들어오면 처음부터 다시 맞춰요.'; break; }
      this.acts.push(a); applied = true;
    }
    if (Object.keys(this.buffer).length) this.askNeed();
    if (applied) { this.save(); resetUi(); render(); }
  },
  askNeed(force) {
    const now = Date.now(); if (!force && now - this.lastNeed < 1500) return;
    this.lastNeed = now;
    this.emit('need', { gid: this.gid, i: this.acts.length });
  },
  onNeed(d) {
    if (!d) return;
    if (d.gid !== this.gid) { if (this.setup) this.emit('setup', this.setup); return; }
    const from = Math.max(0, d.i | 0), list = this.acts.slice(from, from + 40);
    list.forEach((a, k) => setTimeout(() => this.emit('act', { gid: this.gid, i: from + k, a }), k * 60));
  },
};

function deckListHTML(key) {
  const d = DECKS[key];
  const rows = d.main.map(([id, n]) => {
    const c = DEFS[id];
    return `<li data-id="${id}" tabindex="0" role="button"><span class="dot" style="background:var(--c-${c.color})"></span><span class="nm">${esc(c.name)}</span><span class="tag">${c.type === 'command' ? '커맨드' : c.sub === 'ace' ? '에이스' : '유닛'}${c.icon === 'buster' ? ', 버스터' : c.icon === 'shot' ? ', 샷' : ''}</span><b>×${n}</b></li>`;
  }).join('');
  const total = d.main.reduce((t, [, n]) => t + n, 0);
  const errs = Engine.validateDeck(d);
  const manual = d.main.filter(([id]) => DEFS[id].manual).length;
  return `<div class="decklist"><div class="dh"><b>${esc(d.label)}</b>${d.sample ? `<span>${esc(d.collab)}, 공식 사이트 입상 덱 (${esc(d.date)} 등록)</span>` : ''}<span>메인 ${total}장, 테리토리 「${esc(DEFS[d.territory].name)}」</span>
    ${manual ? `<span class="hint">텍스트 능력이 있는 카드 ${manual}종은 수동 조작으로 처리해요</span>` : ''}
    <span class="${errs.length ? 'bad' : 'good'}">${errs.length ? errs.join(', ') : '덱 규칙 통과'}</span></div><ul>${rows}</ul></div>`;
}
/* ── 덱 고르기: 빈 칸을 누르면 덱 목록 창(입상 덱 / 내 덱 / 기본 덱 탭) ── */
const PLACE_KO = [['準優勝', '준우승'], ['優勝', '우승'], ['第3位', '3위'], ['第4位', '4위'], ['ベスト4', '4강'], ['ベスト8', '8강']];
function deckMeta(d) {
  const m = /【(\d{4})\/(\d{1,2})\/(\d{1,2})】/.exec(d.label || '');
  const date = m ? `${m[1]}.${m[2].padStart(2, '0')}.${m[3].padStart(2, '0')}` : (d.date || '').replace(/-/g, '.');
  const place = d.sample ? (PLACE_KO.find(([j]) => d.label.includes(j)) || [])[1] || '입상' : '';
  const n = (d.main || []).reduce((t, [, k]) => t + k, 0);
  return { date, place, n, terr: DEFS[d.territory] };
}
function deckTile(k, opt = {}) {
  const d = DECKS[k], m = deckMeta(d), T = m.terr;
  const title = d.sample ? d.collab : d.label;
  const sub = d.sample ? `${m.date} ${m.place}` : `${m.n}장`;
  const errs = Engine.validateDeck(d);
  return `<button class="dtile ${opt.on ? 'on' : ''}" data-b="${opt.b || 'pickDeck'}" data-k="${esc(k)}" ${opt.i != null ? `data-i="${opt.i}"` : ''} ${opt.disabled ? 'disabled' : ''}>
    <span class="dterr">${T ? cardHTML(T, {}) : ''}</span>
    <span class="dinfo"><b>${esc(title || '')}</b><small class="tname">${esc(T?.name || '')}</small><small>${esc(sub)}${errs.length ? ' <em>덱 규칙 위반</em>' : ''}</small></span></button>`;
}
function deckPicker(i, label, disabled) {
  const k = deckChoice[i];
  if (k && !DECKS[k]) deckChoice[i] = null;
  if (!deckChoice[i]) return `<div class="pickdeck"><span class="plabel">${label}</span>
    <button class="dslot empty" data-b="openDecks" data-i="${i}" ${disabled ? 'disabled' : ''}><b>+</b><span>덱을 골라 주세요</span></button></div>`;

    <div class="dslot">${deckTile(deckChoice[i], { b: 'openDecks', i, disabled })}

}

/* ── 카드 그리기 ── */
function fxText(d) {
  const f = d.fx; if (!f) return '';
  if (f.kind === 'pump') return `자기 유닛 1체 파워 +${f.amount} (이번 턴)`;
  if (f.kind === 'dmg') return `상대 유닛 1체에 ${f.amount} 데미지`;
  if (f.kind === 'destroyLE') return `상대의 파워 ${f.max} 이하 유닛 1체를 드롭`;
  if (f.kind === 'debuff') return `상대 유닛 1체 파워 ${f.power}, 히트 ${f.hit} (이번 턴)`;
  if (f.kind === 'pumpStand') return `자기 유닛 1체 파워 +${f.amount} (이번 턴). 상대 턴이면 스탠드`;
  return '';
}
function abilityLines(d) {
  const ls = [];
  if (d.kesso) ls.push(`결속(${d.kesso.map(attrKo).join('/')})`);
  if (d.bright) ls.push(`브라이트(${d.bright.attrs.map(attrKo).join('/')}) +${d.bright.amount}`);
  ls.push(...d.icons.map(ic => `${COND[ic.cond].text ? COND[ic.cond].text + ' ' : ''}${EFF[ic.eff].text}`));
  return ls;
}
function typeLine(d) {
  if (d.type === 'class') return '클래스 카드 (토큰): 붙은 유닛 파워 +1000';
  const t = d.type === 'unit' ? (d.sub === 'ace' ? `에이스 「${d.titles.join('/')}」` : '유닛') : d.type === 'command' ? '커맨드' : '테리토리';
  return d.attr.length ? `${t}, ${d.attr.map(attrKo).join('/')}` : t;
}
/** 카드 한 장. u가 있으면 필드 위 유닛의 현재 값으로 표시 */
const COND_SHORT = { redzone: '레드 존', terr: '개방 중', myTurn: '내 턴', oppTurn: '상대 턴', always: '', enter: '등장', drop: '드롭', battle: '배틀' };
/** 카드 앞면용 짧은 능력 라벨 (전체 설명은 오른쪽 패널) */
function abilityChips(d) {
  const c = [];
  if (d.kesso) c.push(['결속', '']);
  if (d.cos) c.push([`코스프레 ${d.cos}`, '']);
  if (d.cad) c.push(['CAD', '']);
  if (d.gaku) c.push(['아구력', '']);
  if (d.yumemi) c.push(['꿈을 꾸지 않아', '']);
  if (d.magia) c.push(['마기아', '']);
  if (d.makein) c.push(['마케인', '']);
  if (d.log) c.push(['로그', '']);
  if (d.renai) c.push(['연애 두뇌전', '']);
  if (d.kamui) c.push([`신의-${d.kamui.join('/')}`, '']);
  if (d.dress) c.push([`입는 카드: ${d.dress.join('/')}`, '']);
  if (d.net3) c.push(['INTERNET3.0', '']);
  if (d.tokki) c.push([`특기 사항 ${d.tokki}`, '']);
  if (d.aibou) c.push([`파트너: ${attrKo(d.aibou)}`, '']);
  if (d.kaii) c.push([`괴이: ${d.kaii.map(attrKo).join('/')}`, '']);
  if (d.kyokai) c.push([`경계-${d.kyokai}`, '']);
  if (d.magic) c.push(['마법', '']);
  if (d.bright) c.push([`브라이트 +${d.bright.amount / 1000}천`, '']);
  for (const ic of d.icons) c.push([`${COND_SHORT[ic.cond] ? COND_SHORT[ic.cond] + ': ' : ''}${EFF[ic.eff].text.replace('파워 ', '파워').replace('히트 ', '히트')}`, '']);
  if ((d.text || []).length) c.push([d.manual ? '텍스트 능력' : '텍스트 능력 (자동)', 't']);
  return c.length ? `<div class="chips">${c.map(([t, k]) => `<span class="${k}">${esc(t)}</span>`).join('')}</div>` : '';
}
function cardHTML(d, opt = {}) {
  const u = opt.u;
  const trig = d.icon === 'buster' ? '<span class="trig" aria-label="버스터">💣</span>' : d.icon === 'shot' ? '<span class="trig" aria-label="샷">★</span>' : '';
  const abs = abilityChips(d);
  let stats = '';
  if (d.type === 'unit') {
    const pw = u ? Engine.power(S, u) : d.power, ht = u ? Engine.hit(S, u) : d.hit;
    const pc = pw > d.power ? 'up' : pw < d.power ? 'down' : '';
    stats = `<div class="stats"><span class="pw ${pc}">${pw}</span><span class="hits" aria-label="히트 ${ht}">${Array.from({ length: ht }, (_, i) => `<i class="${i >= d.hit ? 'up' : ''}"></i>`).join('')}</span></div>`;
  } else if (d.fx) stats = `<div class="fx">${esc(fxText(d))}</div>`;
  const kws = u ? KW_SHOW.filter(k => Engine.hasKw(S, u, k)) : [];
  const attrs = opt.attrs || '';
  // 이미지 카드 위에 보여줄 현재 수치 (기본값과 다를 때만)
  let badge = '';
  if (u && d.type === 'unit') {
    const pw = Engine.power(S, u), ht = Engine.hit(S, u);
    if (pw !== d.power || ht !== d.hit) badge = `<span class="badge ${pw > d.power || ht > d.hit ? 'up' : 'down'}">${pw}${ht !== d.hit ? ` / 히트 ${ht}` : ''}</span>`;
  }
  // 텍스트 카드로 먼저 그리고, 이미지가 실제로 불러와지면 이미지로 바꿈 (불러온 주소는 기억해 다음부터 바로 이미지)
  const src = imgUrl(d);
  const loaded = src && IMG_OK.has(src);
  const img = src ? `<img class="art" src="${src}" alt="${esc(d.name)}" draggable="false" ${loaded ? '' : 'onload="imgLoaded(this)"'}>` : '';
  const focus = ui.detail && (opt.u ? ui.detail.uid === u.uid : opt.uid && ui.detail.uid === opt.uid) ? 'focus' : '';
  return `<div class="card ${d.color} ${d.land ? 'land' : ''} ${src ? 'hasimg' : ''} ${src && !loaded ? 'noimg' : ''} ${focus} ${opt.cls || ''}" data-id="${d.id}" ${opt.uid ? `data-cu="${opt.uid}"` : ''} ${attrs} aria-label="${esc(d.name)}">
    ${img}<span class="cost">${d.cost}</span>${trig}
    ${kws.length ? `<span class="kw">${kws.map(k => `<span>${KW_TEXT[k]}</span>`).join('')}</span>` : ''}
    <div class="body"><div class="nm">${esc(d.name)}</div><div class="ty">${esc(typeLine(d))}</div>${abs}${stats}</div>
    ${u && u.damage ? `<span class="dmg" title="이번 턴 받은 데미지. 파워 이상이 되면 파괴돼요">피해 ${u.damage}</span>` : ''}${src ? badge : ''}</div>`;
}
const clickAttrs = (z, o, uid) => `data-z="${z}" data-o="${o}" data-u="${uid}" tabindex="0" role="button"`;

function unitHTML(u) {
  const d = DEFS[u.id], pd = S.pending;
  let cls = '';
  if (ui.tgt) {
    const ok = ui.tgt.kind === 'attack' ? Engine.attackTargets(S, S.active, ui.tgt.uid).includes(u.uid)
      : Engine.targetsFor(S, ui.tgt.who, DEFS[ui.tgt.def]).includes(u.uid);
    if (ok) cls = 'tg';
  } else if (pd?.type === 'block' && u.owner === pd.player && !u.rested && u.uid !== pd.target && !Engine.hasKw(S, u, 'noBlock')) cls = 'tg';
  else if (!pd && S.phase === 'attack' && Engine.canAttack(S, u)) cls = 'can';
  if (ui.tgt?.kind === 'attack' && ui.tgt.uid === u.uid) cls += ' sel';
  if (u.rested) cls += ' rested';
  const att = (u.att || []).length ? `<span class="attn" title="${esc(u.att.map(a => DEFS[a.id].name).join(', '))}">붙은 카드 ${u.att.length}</span>` : '';
  const html = cardHTML(d, { u, cls, attrs: clickAttrs('field', u.owner, u.uid) });
  const extra = att + pickNum(u);
  return extra ? html.replace(/<\/div>$/, extra + '</div>') : html;
}
function handCardHTML(owner, c) {
  const d = DEFS[c.id], pd = S.pending;
  let cls = '';
  if (pd?.type === 'bright') { if (d.attr.some(a => DEFS[Engine.findUnit(S, pd.uid).id].bright.attrs.includes(a))) cls = 'tg'; }
  else if (pd?.type === 'discard' || (pd?.type === 'seika' && pd.step === 'discard')) cls = 'tg';
  else if (!pd && S.phase === 'main' && owner === S.active) cls = 'can';
  if (ui.sel === c.uid) cls += ' sel';
  return cardHTML(d, { cls, uid: c.uid, attrs: clickAttrs('hand', owner, c.uid) });
}

/* ── 매트 ── */
/* 공식 플레이 시트 그림에서 잰 칸 위치 (가로·세로 %, 내 시트 기준). 상대 시트는 180도 돌려 씀 */
const PS_BOX = {

  if (T.id === 'NOTERR') return `<div class="z terr" ${psPos('terr', mine)}><span class="zl">TERRITORY<small>테리토리</small></span><div class="tbody"><div class="tinfo"><b>테리토리 없음</b><span class="st">${tz.length ? `테리토리 존: ${tz.map(a => esc(DEFS[a.id].name)).join(', ')}` : '리무브됨'}</span>${tzBtns}</div></div></div>`;

function miniImg(c) {

function matHTML(p, isViewer) {

/* 고르기 창에서 같은 카드를 구분하는 표시: 「P2 필드 2번」 (필드는 왼쪽부터, 나머지 존은 놓인 순서) */
const ZONE_KO = { field: '필드', hand: '패', drop: '드롭 존', energy: '에너지', deck: '덱', life: '라이프', remove: '리무브 존', set: '뒷면 카드' };
function cardTag(uid) {
  const u = Engine.findUnit(S, uid), me = viewerSeat();
  if (u) { const i = Engine.unitsOf(S, u.owner).findIndex(x => x.uid === uid); return { text: `${S.players[u.owner].name} 필드 ${i + 1}번${u.rested ? ', 레스트' : ''}`, mine: u.owner === me, n: i + 1 }; }
  for (let q = 0; q < 2; q++) for (const z of ['hand', 'drop', 'energy', 'life', 'remove', 'set', 'deck']) {
    const Z = S.players[q][z] || [], i = Z.findIndex(c => c.uid === uid);
    if (i >= 0) return { text: z === 'deck' ? `${S.players[q].name} 덱 위 ${i + 1}번째` : `${S.players[q].name} ${ZONE_KO[z]} ${i + 1}번`, mine: q === me, n: i + 1 };
  }
  return null;
}
/** 필드 카드가 지금 고르기 후보면 번호표를 붙임 */
function pickNum(u) {
  const pd = S.pending; if (pd?.type !== 'fx' || pd.kind !== 'pick' || !(pd.show || pd.cands || []).includes(u.uid) || !myControl()) return '';
  const i = Engine.unitsOf(S, u.owner).findIndex(x => x.uid === u.uid);

/* ── 진행 안내 ── */
/* 가운데 진행 바: 높이가 고정이라 내용이 바뀌어도 매트가 움직이지 않음.
   페이즈 표시와 '다음 페이즈' 버튼을 내 필드 바로 위에 둠 */
function promptBar() {
  const pr = promptHTML();
  const phases = `<div class="phases" aria-label="페이즈">${PHASES.map(([k, t]) => `<span class="${S.phase === k ? 'now' : ''}">${t}</span>`).join('')}</div>`;
  const floating = pr.includes('class="cards"') || pr.includes('class="opts"') || pr.includes('class="fxsrc"');
  const inner = floating ? `<div class="prompt in"><div class="msg">가운데 선택 창에서 골라 주세요.</div></div>` : pr.replace('class="prompt"', 'class="prompt in"');
  return `<div class="strip">${phases}${inner}</div>` + (floating ? pr.replace('class="prompt"', 'class="prompt float" role="dialog"') : '');

function promptHTML() {

/** 카드 효과 처리 중 선택 (pending 'fx') */
function fxPromptHTML(pd, P) {
  const q = pd.q, d = DEFS[q.id], a = (d.ab || [])[q.ai] || {};
  const li = a.li || [0];
  const src = d.type === 'territory' ? tfxText(d) : li.map(i => cardLine(d, i)).filter(Boolean).join(' ');
  const head = `<b>${P.name}</b>, ${esc(d.name)}<div class="fxsrc">${esc(src)}</div>`;
  if (pd.kind === 'confirm') return `<div class="prompt"><div class="msg">${head}${esc(pd.text)}</div><button class="go" data-b="fxYes">${pd.cost ? '발동' : '쓴다'}</button><button data-b="fxNo">${pd.cost ? '발동하지 않음' : '쓰지 않음'}</button></div>`;
  if (pd.kind === 'choose') {
    const opts = (pd.labels || li.slice(1).map(i => cardLine(d, i).replace(/^・/, ''))).map((t, k) => `<button class="opt" data-b="fxChoose" data-v="${k}" ${pd.dis?.includes(k) ? 'disabled' : ''}>${esc(t)}</button>`).join('');
    return `<div class="prompt"><div class="msg">${head}${esc(pd.text)}</div><div class="opts">${opts}</div></div>`;
  }
  // pick: 후보 카드를 띄워 고름
  const sel = ui.fxSel || [];
  const all = (pd.show || pd.cands);
  const cardOf = uid => { const u = Engine.findUnit(S, uid); if (u) return { c: u, u };
    for (const Q of S.players) for (const z of ['hand', 'drop', 'energy', 'deck', 'life', 'remove']) { const c = (Q[z] || []).find(x => x.uid === uid); if (c) return { c }; } return null; };
  const showTag = all.length > 1 || all.some(uid => Engine.findUnit(S, uid));
  const cards = all.map(uid => { const f = cardOf(uid); if (!f) return '';
    const ok = pd.cands.includes(uid);
    const html = cardHTML(DEFS[f.c.id], { u: f.u, uid, cls: ok ? (sel.includes(uid) ? 'sel tg' : 'tg') : pd.act === 'peek' ? '' : 'dim', attrs: ok ? clickAttrs('pick', pd.player, uid) : '' });
    const t = showTag ? cardTag(uid) : null;
    return t ? `<div class="pickc" data-hl="${uid}">${html}<small class="ptag ${t.mine ? 'mine' : 'opp'}">${esc(t.text)}</small></div>` : html; }).join('');
  if (pd.act === 'peek') return `<div class="prompt"><div class="msg">${head}${esc(pd.text)}</div><div class="cards">${cards}</div><button class="go" data-b="fxOk">확인</button></div>`;
  const range = pd.min === pd.max ? `${pd.max}장` : `${pd.min ? pd.min + '~' : '최대 '}${pd.max}장`;
  const can = sel.length >= pd.min && sel.length <= pd.max;
  return `<div class="prompt"><div class="msg">${head}${esc(pd.text)} (${range}, ${sel.length}장 고름)</div><div class="cards">${cards}</div>
    <button class="go" data-b="fxOk" ${can ? '' : 'disabled'}>확정</button>${pd.min === 0 ? '<button data-b="fxNone">고르지 않음</button>' : ''}</div>`;
}

/* ── 카드 설명 ── */
const IMG_OK = new Set();
/* ── 카드 이미지 묶음 (게시 페이지용) ──
   게시 페이지는 외부 이미지를 못 불러와서, 페이지와 함께 올린 작품별 묶음(packs/*.bin)을 받아 잘라 씀.
   묶음 색인을 못 받으면(예: PC에서 연 파일) 공식 이미지 주소를 그대로 씀. */
const Packs = { index: null, urls: {}, loading: {} };
async function initPacks() {
  try {
    const r = await fetch('packs/index.json');
    if (r.ok) { Packs.index = await r.json(); render(); }
  } catch {}
}
async function loadPack(name) {
  if (Packs.loading[name]) return;
  Packs.loading[name] = true;
  try {
    const buf = await (await fetch('packs/' + Packs.index.packs[name])).arrayBuffer();
    for (const [k, [p, o, l]] of Object.entries(Packs.index.img)) {
      if (p !== name) continue;
      const url = URL.createObjectURL(new Blob([buf.slice(o, o + l)], { type: 'image/webp' }));
      Packs.urls[k] = url; IMG_OK.add(url);
    }
    render();
  } catch { /* 실패한 묶음은 다시 요청하지 않음 (텍스트 카드로 표시) */ }
}
/** 카드 이미지 주소: 묶음에서 꺼낸 blob 주소 → 없으면 공식 주소 (back=true면 테리토리 미개방면) */
function imgUrl(d, back) {
  if (!d.jp) return back ? null : (d.img || null);
  const key = (back ? 'b' : '') + d.jp;
  if (Packs.urls[key]) return Packs.urls[key];
  if (Packs.index) {
    const e = Packs.index.img[key];
    if (e) { loadPack(e[0]); return null; }
  }
  return back ? null : (d.img || null);
}
function imgLoaded(el) {
  IMG_OK.add(el.getAttribute('src'));
  el.closest('.card')?.classList.remove('noimg');
}
/** uid로 카드가 지금 어디 있는지 찾기 */
function locate(uid) {
  if (!uid) return null;
  const u = Engine.findUnit(S, uid); if (u) return { where: '필드', p: u.owner, u };
  for (const x of S.field) if ((x.att || []).some(a => a.uid === uid)) return { where: `필드 (${DEFS[x.id].name}에 붙음)`, p: x.owner, host: x };
  for (let p = 0; p < 2; p++) {
    const P = S.players[p];
    if (P.hand.some(c => c.uid === uid)) return { where: '패', p };
    if (P.drop.some(c => c.uid === uid)) return { where: '드롭 존', p };
    if ((P.remove || []).some(c => c.uid === uid)) return { where: '리무브 존', p };
    const e = P.energy.find(c => c.uid === uid); if (e) return { where: e.rested ? '에너지 (레스트)' : '에너지', p };
    if (P.deck.some(c => c.uid === uid)) return { where: '덱', p };
    if ((P.set || []).some(c => c.uid === uid)) return { where: '필드 (뒷면)', p };
    if (P.territory.uid === uid) return { where: P.territory.open ? '테리토리 (개방)' : '테리토리 (미개방)', p };
  }
  if (S.pending?.type === 'shot' && S.pending.card.uid === uid) return { where: '샷 트리거로 공개됨', p: S.pending.player };
  return null;
}
/* 카드 효과 언어: 번역 DB(db/ko_lines.json)에서 만든 한국어가 기본, 원문 보기로 일본어 */
let LANG = 'ko';
try { LANG = localStorage.getItem('bdb-lang') || 'ko'; } catch {}
const cardLine = (d, i) => (LANG === 'ko' && d.ko?.[i]) || d.text[i];
const tfxText = d => (LANG === 'ko' && d.tfx?.ko) || d.tfx?.text || '';
/** 카드 설명에서 '이 능력 처리하기'를 누를 수 있는지 */

/** 직접 처리 중: 능력 원문 + 양쪽 플레이어 조작 + 처리 완료 */

/* 수동 조작 버튼: 자동화되지 않은 효과를 손으로 처리 (행동으로 기록되어 온라인에서도 같이 맞춰짐) */
function manualHTML(det, loc) {
  if (screen !== 'game' || !S || S.winner != null || !loc || !myControl()) return '';
  if (loc.where === '패' && loc.p !== viewerSeat() && !(playMode === 'local')) return '';
  if (loc.where.startsWith('테리토리') || loc.where.startsWith('샷')) return '';
  const B = (label, o) => `<button data-b="man" ${Object.entries(o).map(([k, v]) => `data-${k}="${v}"`).join(' ')}>${label}</button>`;
  const uid = det.uid, bs = [];
  const z = loc.where;
  const mv = (to, label) => B(label, { op: 'move', uid, to });
  if (z === '필드') {
    bs.push(B(loc.u.rested ? '스탠드' : '레스트', { op: 'rest', uid }));
    bs.push(B('파워 +1000', { op: 'pow', uid, v: 1000 }), B('파워 −1000', { op: 'pow', uid, v: -1000 }));
    bs.push(B('히트 +1', { op: 'hitmod', uid, v: 1 }), B('히트 −1', { op: 'hitmod', uid, v: -1 }));
    bs.push(B('데미지 +1000', { op: 'dmg', uid, v: 1000 }));
    bs.push(mv('drop', '드롭 존으로'), mv('hand', '패로'), mv('deckBottom', '덱 맨 아래로'), mv('energy', '에너지로'), mv('remove', '리무브 존으로'));
  } else {
    if (z.startsWith('에너지')) bs.push(B(z.includes('레스트') ? '스탠드' : '레스트', { op: 'rest', uid }));
    if (DEFS[det.id].type === 'unit') bs.push(mv('field', '필드에 등장'));
    if (z !== '패') bs.push(mv('hand', '패로'));
    if (z !== '드롭 존') bs.push(mv('drop', '드롭 존으로'));
    if (!z.startsWith('에너지')) bs.push(mv('energy', '에너지로'));
    bs.push(mv('life', '라이프 맨 앞으로'), mv('deckTop', '덱 맨 위로'), mv('deckBottom', '덱 맨 아래로'));
    if (z !== '리무브 존') bs.push(mv('remove', '리무브 존으로'));
  }
  const p = loc.p, P = S.players[p];
  const pl = [B('1장 드로우', { op: 'draw', p }), B('덱 섞기', { op: 'shuffle', p }), B('덱 위 → 라이프', { op: 'lifeFromDeck', p }), B('라이프 → 패', { op: 'lifeToHand', p })];
  return `<details class="manual" ${ui.manOpen || S.pending?.type === 'manual' ? 'open' : ''} ontoggle="ui.manOpen=this.open"><summary>수동 조작</summary>
    <div class="mrow"><span>이 카드</span>${bs.join('')}</div>
    <div class="mrow"><span>${esc(P.name)}</span>${pl.join('')}</div></details>`;
}

/* ── 카드 목록 창 (에너지·드롭 존) ── */
function viewHTML() {
  if (!ui.view) return '';
  const { p, zone } = ui.view, P = S.players[p];
  const ZT = { drop: '드롭 존', energy: '에너지', remove: '리무브 존', deck: '덱 (맨 위부터)', life: '라이프 (맨 앞부터)', set: '필드에 뒷면으로 둔 카드' };
  const hidden = zone === 'set' && p !== viewerSeat() && S.winner == null;
  const cards = zone === 'drop' ? [...P.drop].reverse() : zone === 'remove' ? [...(P.remove || [])].reverse() : zone === 'deck' ? P.deck : zone === 'life' ? P.life : zone === 'set' ? (hidden ? [] : P.set || []) : P.energy;
  const title = `${P.name}의 ${ZT[zone]}`;
  let sub = `${cards.length}장`;
  if (zone === 'energy') {
    const by = {}; for (const e of P.energy) by[DEFS[e.id].color] = (by[DEFS[e.id].color] || 0) + 1;
    sub += `, 스탠드 ${P.energy.filter(e => !e.rested).length}장. 색별: ${Object.entries(by).map(([c, n]) => `${COLOR_KO[c]} ${n}`).join(', ')}`;
  } else if (zone !== 'deck' && zone !== 'life') sub += ', 최근에 놓인 카드부터';
  const mode = ui.view.mode || 'list';
  let body;
  if (hidden) body = `<p class="empty">상대가 뒷면으로 둔 카드 ${(P.set || []).length}장이에요. 앞면은 볼 수 없어요.</p>`;
  else if (!cards.length) body = `<p class="empty">${ZT[zone]}에 카드가 없어요.</p>`;
  else if (mode === 'group') {
    const g = new Map(); for (const c of cards) g.set(c.id, (g.get(c.id) || 0) + 1);
    body = `<div class="grid">${[...g].map(([id, n]) => `<div class="grp">${cardHTML(DEFS[id], { uid: cards.find(c => c.id === id).uid })}<span class="x">×${n}</span></div>`).join('')}</div>`;
  } else body = `<div class="grid">${cards.map(c => `<div class="grp">${cardHTML(DEFS[c.id], { uid: c.uid, cls: (c.rested ? 'rested ' : '') + (c.down ? 'facedown' : '') })}${c.down ? '<span class="x">뒷면</span>' : ''}${zone === 'drop' && p === controller() && S.active === p && S.phase === 'main' && !S.pending && Engine.dropPlayable(S, p, c) ? `<button data-b="playDrop" data-u="${c.uid}">여기서 플레이</button>` : ''}${zone === 'drop' && p === controller() && S.active === p && S.phase === 'main' && !S.pending && (S.turn.flags || {}).dropAsHand === p + 1 && !P.energySet ? `<button data-b="energyDrop" data-u="${c.uid}">에너지로 놓기</button>` : ''}</div>`).join('')}</div>`;
  return `<div class="modal" data-b="closeView"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <header><h2>${esc(title)}</h2><span class="sub">${esc(sub)}</span>
      <div class="seg"><button class="${mode === 'list' ? 'on' : ''}" data-b="viewMode" data-m="list">한 장씩</button><button class="${mode === 'group' ? 'on' : ''}" data-b="viewMode" data-m="group">같은 카드 묶기</button></div>
      <button data-b="closeView" data-x="1">닫기</button></header>
    <div class="split"><div class="body">${body}</div><div class="side-d">${detailHTML(ui.detail)}</div></div></div></div>`;
}

/* ── 효과음 (WebAudio로 즉석 합성: 파일 없음) ───────────────── */
const Sfx = {
  ctx: null, on: (() => { try { return localStorage.getItem('bdb-sfx') !== '0'; } catch { return true; } })(),
  ensure() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } }
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    return this.ctx;
  },
  tone(f, d, o = {}) {
    const c = this.ctx, t = c.currentTime + (o.at || 0), g = c.createGain(), os = c.createOscillator();
    os.type = o.type || 'sine'; os.frequency.setValueAtTime(f, t); if (o.to) os.frequency.exponentialRampToValueAtTime(o.to, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.vol || .18, t + Math.min(.02, d / 4)); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    os.connect(g).connect(c.destination); os.start(t); os.stop(t + d + .05);
  },
  noise(d, o = {}) {

/* ── 연출: 엔진이 남긴 사건(S.fx)을 순서대로 보여 줌 ─────────────
   공격·배틀·데미지·파괴·등장·능력 발동을 한 박자씩 보여 주고, 그동안 화면을 누르면 건너뜀 */
const Fx = {

  mode: (() => { try { return localStorage.getItem('bdb-fx') || 'normal'; } catch { return 'normal'; } })(),
  layer() { return document.getElementById('fxlayer'); },
  capture() {   // 다시 그리기 전에 필드 카드 자리를 기억 (사라진 카드의 연출에 씀)
    document.querySelectorAll('.ps .card[data-z="field"][data-u]').forEach(el => { this.rects[el.dataset.u] = el.getBoundingClientRect(); });
  },
  reset() { clearTimeout(this.timer); this.q = []; this.busy = false; this.rects = {}; const L = this.layer(); if (L) L.innerHTML = ''; this.shield(false); },
  sync() {
    if (!S || typeof document === 'undefined') return;
    if ((S.fxSeq || 0) < this.seen) { this.reset(); this.seen = 0; }
    const fresh = (S.fx || []).filter(e => e.n > this.seen);
    this.seen = Math.max(this.seen, S.fxSeq || 0);
    if (this.mode !== 'off' && fresh.length <= 40) this.q.push(...fresh);   // 다시 접속해 한꺼번에 따라잡을 때는 연출 생략
    if (!this.busy) this.next();
  },
  speed() { const base = this.mode === 'fast' ? .5 : 1; return this.q.length > 10 ? base * .45 : this.q.length > 5 ? base * .7 : base; },
  next() {

    this.busy = true; this.shield(true);
    let d = 0; try { d = this.show(e); } catch (err) { d = 0; }
    this.timer = setTimeout(() => this.next(), d * this.speed());
  },
  skip() { clearTimeout(this.timer); this.q = []; const L = this.layer(); if (L) L.innerHTML = ''; this.busy = false; this.shield(false); Reveal.sync(); },
  shield(on) { const el = document.getElementById('fxshield'); if (el) el.hidden = !on; },
  el(uid) { return document.querySelector(`.ps .card[data-z="field"][data-u="${uid}"]`); },
  rect(uid) { const el = this.el(uid); return el ? el.getBoundingClientRect() : this.rects[uid] || null; },
  add(html, cls, style = {}, life = 1200) {

  at(r, cls, html = '', life = 900) { return r && this.add(html, cls, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' }, life); },
  banner(html, cls = '', life = 1000) { this.layer()?.querySelectorAll('.fx.banner').forEach(n => n.remove()); return this.add(html, 'banner ' + cls, {}, life); },
  pname(p) { return S.players[p]?.name || ''; },
  mini(id) { const d = DEFS[id]; return d ? cardHTML(d, {}) : ''; },
  show(e) {
    switch (e.k) {
      case 'turn': Sfx.play('turn'); this.banner(`<b>${esc(this.pname(e.p))}의 턴</b><small>${e.t}턴</small>`, 'big', 1100); return 950;
      case 'play': Sfx.play('play'); this.banner(`<div class="fxcard">${this.mini(e.id)}</div><small>${esc(this.pname(e.p))}: 커맨드 플레이</small>`, 'cardb', 1100); return 1000;
      case 'enter': { Sfx.play('enter'); const r = this.rect(e.u); if (r) this.at(r, 'ring enter', '', 700); else return 0; return 420; }

        this.banner(`<div class="fxmini">${this.mini(e.id)}</div><span><small>${esc(this.pname(e.p))}, ${esc(e.kind)}</small><b>${esc(DEFS[e.id]?.name || '')}</b></span>`, 'trig', 1000);

      case 'atk': {

          if (g && tr) { const dx = (tr.left + tr.width / 2) - (r.left + r.width / 2), dy = (tr.top + tr.height / 2) - (r.top + r.height / 2); g.style.setProperty('--dx', dx * .55 + 'px'); g.style.setProperty('--dy', dy * .55 + 'px'); }

        this.banner(`<b>공격!</b><small>${esc(DEFS[e.id]?.name || '')} → ${e.t === 'player' ? esc(this.pname(1 - e.p)) : esc(DEFS[(Engine.findUnit(S, e.t) || {}).id]?.name || '유닛')}</small>`, 'atk', 900);
        return 850;
      }
      case 'blk': { Sfx.play('blk'); const r = this.rect(e.u); if (r) this.at(r, 'ring blk', '', 800); this.banner(`<b>블록!</b><small>${esc(DEFS[e.id]?.name || '')}</small>`, 'blk', 800); return 700; }
      case 'battle': Sfx.play('clash'); this.banner(`<div class="vs"><div class="fxmini">${this.mini(e.ia)}</div><b>${e.pa}</b><i>VS</i><b>${e.pb}</b><div class="fxmini">${this.mini(e.ib)}</div></div>`, 'battle', 1150); return 1100;
      case 'dmg': { const r = this.rect(e.u); if (!r) return 0; Sfx.play('hit'); this.at(r, 'shake', '', 450); this.at(r, 'num', `<b>-${e.n}</b>${e.tot != null && e.tot !== e.n ? `<small>누적 ${e.tot}</small>` : ''}`, 1000); return 380; }

      case 'win': Sfx.play('win'); this.banner(`<b>${esc(this.pname(e.p))} 승리!</b>`, 'big win', 2200); return 1800;

if (typeof document !== 'undefined') document.getElementById('fxshield')?.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); Fx.skip(); });

/* 라이프 데미지로 공개된 카드를 한 장씩 보여 줌 (누르면 다음 장) */
const Reveal = {
  seen: 0, q: [], timer: null, cur: null,
  reset() { this.seen = 0; this.q = []; this.cur = null; clearTimeout(this.timer); const el = document.getElementById('reveal'); if (el) el.innerHTML = ''; },
  sync() {
    if (!S) return;

    if (Fx.busy) return;   // 공격·배틀 연출이 끝난 뒤에 보여 줌
    if (!this.cur) this.next();
  },
  next() {
    clearTimeout(this.timer);

    this.timer = setTimeout(() => this.next(), (r.kind === 'drop' ? 1100 : 1600) * (Fx.mode === 'fast' ? .6 : 1));

if (typeof document !== 'undefined') document.getElementById('reveal')?.addEventListener('click', () => Reveal.next());

let renders = 0;
function onClick(e) {
  // 어떤 카드든 누르면 설명을 띄우고, 원래 동작(선택·공격·대상 지정 등)도 이어서 처리
  const cardEl = e.target.closest('[data-id]');
  if (cardEl) {
    ui.detail = { id: cardEl.dataset.id, uid: cardEl.dataset.cu || cardEl.dataset.u || null };
    if (!ui.view) ui.side = 'card';

}
function handleAction(e, onCard) {
  const b0 = e.target.closest('[data-b]');
  if (onCard && b0?.classList.contains('modal')) return;   // 목록 창 안의 카드: 설명만
  const b = b0;
  if (b && !b.disabled) {
    const k = b.dataset.b, pd = S?.pending;
    if (k === 'closeView') { if (b.classList.contains('modal') && e.target !== b) return; ui.view = null; return render(); }
    if (k === 'view') { ui.view = { p: +b.dataset.p, zone: b.dataset.zone, mode: 'list' }; return render(); }
    if (k === 'viewMode') { ui.view.mode = b.dataset.m; return render(); }
    if (k === 'side') { if (ui.sheet && ui.side === b.dataset.s) ui.sheet = false; else ui.sheet = true; ui.side = b.dataset.s; return render(); }
    if (k === 'sheetClose') { ui.sheet = false; return render(); }
    if (k === 'lang') { LANG = LANG === 'ko' ? 'ja' : 'ko'; try { localStorage.setItem('bdb-lang', LANG); } catch {} return render(); }
    if (k === 'man') {
      const a = { type: 'MANUAL', op: b.dataset.op };
      for (const f of ['uid', 'to', 'v', 'p', 'id']) if (b.dataset[f] !== undefined) a[f] = f === 'v' || f === 'p' ? +b.dataset[f] : b.dataset[f];
      ui.manOpen = true;
      return dispatch(a);
    }
    if (k === 'new') return startNew();
    if (k === 'toLobby') { screen = 'lobby'; return render(); }
    if (k === 'toHome') { screen = 'home'; return render(); }
    if (k === 'goPlay') { screen = 'lobby'; return render(); }
    if (k === 'mode') { playMode = b.dataset.m; return render(); }
    if (k === 'startLocal') { if (!deckChoice[0] || !deckChoice[1]) return; return startNew(); }
    if (k === 'openDecks') { const i = +b.dataset.i; ui.deckPick = { i, tab: DECKS[deckChoice[i]]?.mine ? 'mine' : DECKS[deckChoice[i]] && !DECKS[deckChoice[i]].sample ? 'basic' : (ui.deckPick?.tab || 'sample') }; return render(); }
    if (k === 'closeDecks') { if (b.classList.contains('modal') && e.target !== b) return; ui.deckPick = null; return render(); }
    if (k === 'deckTab') { ui.deckPick.tab = b.dataset.t; return render(); }
    if (k === 'toggleList') { const i = +b.dataset.i; ui.deckList = ui.deckList === i ? null : i; return render(); }
    if (k === 'pickDeck') {
      const i = ui.deckPick.i; deckChoice[i] = b.dataset.k; ui.deckPick = null; ui.deckList = null;
      const T = DEFS[DECKS[b.dataset.k].territory]; if (T) ui.detail = { id: DECKS[b.dataset.k].territory };
      if (Net.code) Net.pushPresence();
      return render();
    }
    if (k === 'builder') return openBuilder(null);
    if (screen === 'builder') return builderAction(k, b);
    if (k === 'createRoom') { const code = Math.random().toString(36).slice(2, 8); return Net.join(code, 0); }
    if (k === 'joinRoom') {
      const v = (document.getElementById('roomcode')?.value || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
      if (v.length < 4) { toast = '방 코드를 확인해 주세요'; return render(); }
      return Net.join(v, 1);
    }
    if (k === 'leaveRoom') { playMode = 'online'; return Net.leave(); }
    if (k === 'copyCode') { try { navigator.clipboard.writeText(Net.code).then(() => { toast = '방 코드를 복사했어요'; render(); }, () => {}); } catch {} return; }
    if (k === 'ready') { if (!Net.ready && !deckChoice[Math.max(0, Net.seat)]) return; Net.ready = !Net.ready; Net.pushPresence(); return render(); }
    if (k === 'hostStart' || k === 'rematch') { Net.ready = false; return Net.start(); }
    if (screen === 'lobby' || screen === 'home') return;
    // 온라인에서 상대 차례에는 게임 조작을 막음 (보기 기능은 허용)
    if (!myControl() && !['view', 'viewMode', 'side', 'closeView', 'cancel'].includes(k)) { toast = '상대가 진행할 차례예요'; return render(); }
    if (k === 'next') return dispatch({ type: 'NEXT_PHASE' });
    if (k === 'endTurn') {
      const t0 = S.turnCount;
      dispatch({ type: 'NEXT_PHASE' });
      if (S.turnCount === t0 && S.phase === 'attack' && !S.pending && myControl()) dispatch({ type: 'NEXT_PHASE' });
      return;
    }
    if (k === 'order') return dispatch({ type: 'ORDER', i: +b.dataset.i });
    if (k === 'fxMode') { Fx.mode = { normal: 'fast', fast: 'off', off: 'normal' }[Fx.mode]; try { localStorage.setItem('bdb-fx', Fx.mode); } catch {} if (Fx.mode === 'off') Fx.skip(); return render(); }
    if (k === 'sfx') { Sfx.on = !Sfx.on; try { localStorage.setItem('bdb-sfx', Sfx.on ? '1' : '0'); } catch {} if (Sfx.on) { Sfx.ensure(); Sfx.play('trig'); } return render(); }
    if (k === 'keep') return dispatch({ type: 'MULLIGAN', redraw: false });
    if (k === 'redraw') return dispatch({ type: 'MULLIGAN', redraw: true });
    if (k === 'noBlock') return dispatch({ type: 'BLOCK', blocker: null });
    if (k === 'cancel') { resetUi(); return render(); }
    if (k === 'energy') return dispatch({ type: 'SET_ENERGY', uid: ui.sel });
    if (k === 'atkPlayer') return dispatch({ type: 'ATTACK', attacker: ui.tgt.uid, target: 'player' });
    if (k === 'terrYes') return dispatch({ type: 'TERRITORY', open: true });
    if (k === 'terrNo') return dispatch({ type: 'TERRITORY', open: false });
    if (k === 'brightNo') return dispatch({ type: 'BRIGHT', discard: null });

    if (k === 'brightDropCard') return dispatch({ type: 'BRIGHT', discard: +b.dataset.u || b.dataset.u });
    if (k === 'playTerr') return dispatch({ type: 'PLAY', uid: +b.dataset.u || b.dataset.u, fromTerr: 1 });
    if (k === 'energyDrop') { ui.view = null; return dispatch({ type: 'SET_ENERGY', uid: +b.dataset.u || b.dataset.u, fromDrop: 1 }); }
    if (k === 'playDrop') { ui.view = null; return dispatch({ type: 'PLAY', uid: +b.dataset.u || b.dataset.u, fromDrop: 1 }); }
    if (k === 'play') {
      const d = DEFS[S.players[S.active].hand.find(c => c.uid === ui.sel).id], need = Engine.needsTarget(d);
      if (need) { ui.tgt = { kind: 'play', uid: ui.sel, def: d.id, who: S.active }; return render(); }
      return dispatch({ type: 'PLAY', uid: ui.sel });
    }
    if (k === 'shotYes') {
      const d = DEFS[pd.card.id], need = Engine.needsTarget(d);
      if (need && Engine.targetsFor(S, pd.player, d).length) { ui.tgt = { kind: 'shot', def: d.id, who: pd.player }; return render(); }
      return dispatch({ type: 'SHOT', play: true });
    }
    if (k === 'shotNo') return dispatch({ type: 'SHOT', play: false });
    if (k === 'seikaNo') return dispatch({ type: 'SEIKA', uid: null });
    if (k === 'flashNo') return dispatch({ type: 'FLASHBACK', uid: null });
    if (k === 'fxYes' || k === 'fxNo') { ui.fxSel = []; return dispatch({ type: 'FX', yes: k === 'fxYes' }); }
    if (k === 'cosNo') return dispatch({ type: 'COSPLAY', pick: null });
    if (k === 'dressNo') return dispatch({ type: 'DRESS', unit: null });
    if (k === 'setNo') return dispatch({ type: 'PLAY_SET', uid: null });
    if (k === 'playSet') return dispatch({ type: 'PLAY_SET', uid: b.dataset.u });
    if (k === 'manDone') return dispatch({ type: 'MANUAL', op: 'done' });
    if (k === 'fxChoose') return dispatch({ type: 'FX', choice: +b.dataset.v });

  if (zone === 'pick') {
    if (pd?.type === 'cosplay') return dispatch({ type: 'COSPLAY', pick: uid });
    if (pd?.type === 'dress') return dispatch({ type: 'DRESS', unit: uid });
    if (pd?.type === 'setPlay') return dispatch({ type: 'PLAY_SET', uid });
    if (pd?.type === 'fx') {
      const sel = ui.fxSel || (ui.fxSel = []);
      const i = sel.indexOf(uid); if (i >= 0) sel.splice(i, 1); else { if (sel.length >= pd.max) sel.shift(); sel.push(uid); }

    if (pd?.type === 'flashback') return dispatch({ type: 'FLASHBACK', uid });

  }

    if (zone !== 'field') return;
    if (ui.tgt.kind === 'attack') return dispatch({ type: 'ATTACK', attacker: ui.tgt.uid, target: uid });
    if (ui.tgt.kind === 'play') return dispatch({ type: 'PLAY', uid: ui.tgt.uid, target: uid });
    if (ui.tgt.kind === 'shot') return dispatch({ type: 'SHOT', play: true, target: uid });
  }
